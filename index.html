<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학민정부 실시간 대시보드 v5.5.1 (입법부 기능 완벽 복구)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        govBlue: '#002244',
                        govGold: '#D4AF37',
                        govLight: '#F4F7F9'
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-govLight text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- Firebase 초기화 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCVJmFud6HYoKMHzB71oGTUEDJ0jwcrWy4",
            authDomain: "hakmin-gov.firebaseapp.com",
            projectId: "hakmin-gov",
            storageBucket: "hakmin-gov.firebasestorage.app",
            messagingSenderId: "424077081688",
            appId: "1:424077081688:web:d0230b7583771bd2a69e2d"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect } = React;

        // --- 초기 데이터 뼈대 ---
        const initialStudents = [];
        const initialBills = [];
        const initialExecutive = { report: '새로운 회기가 시작되었습니다.', complaints: [] };
        const initialPraises = [];
        const initialPolls = [];

        // --- 아이콘 모음 ---
        const IconGov = () => <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>;
        const IconGavel = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>;
        const IconScroll = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
        const IconUsers = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconHeart = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>;
        const IconChart = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>;
        const IconLock = () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>;
        const IconEye = () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>;

        const App = () => {
            const [activeTab, setActiveTab] = useState('executive');
            const [role, setRole] = useState('student');
            const [isMasked, setIsMasked] = useState(true);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [pwdInput, setPwdInput] = useState('');
            const [modalType, setModalType] = useState(null);
            const [formData, setFormData] = useState({});
            const [modalError, setModalError] = useState('');
            
            const [isDataLoaded, setIsDataLoaded] = useState(false);

            const sessionOptions = [
                ...Array.from({ length: 10 }, (_, i) => `${i + 3}월`),
                ...Array.from({ length: 10 }, (_, i) => `임시회의 ${i + 1}`)
            ];
            
            const [currentSession, setCurrentSession] = useState('3월'); 
            const [passwords, setPasswords] = useState({ teacher: '1234', council: '5678' });
            const [appData, setAppData] = useState({});

            // 1. 공통 설정 불러오기
            useEffect(() => {
                const unsubscribeSettings = db.collection('settings').doc('global')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setCurrentSession(data.activeSession || '3월');
                            if (data.passwords) setPasswords(data.passwords);
                        }
                    });
                return () => unsubscribeSettings();
            }, []);

            // 2. 데이터 불러오기
            useEffect(() => {
                if (!currentSession) return;
                setIsDataLoaded(false);

                const unsubscribeData = db.collection('classData').doc(currentSession)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            setAppData(prev => ({ ...prev, [currentSession]: doc.data() }));
                        } else {
                            const initData = { students: initialStudents, bills: initialBills, executiveData: initialExecutive, praises: initialPraises, polls: initialPolls };
                            setAppData(prev => ({ ...prev, [currentSession]: initData }));
                        }
                        setIsDataLoaded(true);
                    });
                return () => unsubscribeData();
            }, [currentSession]);

            const currentSessionData = appData[currentSession] || {
                students: [], bills: [], executiveData: { report: '', complaints: [] }, praises: [], polls: []
            };

            const students = currentSessionData.students || [];
            const bills = currentSessionData.bills || [];
            const executiveData = currentSessionData.executiveData || { report: '', complaints: [] };
            const praises = currentSessionData.praises || [];
            const polls = currentSessionData.polls || [];

            const handleSessionChange = (newSession) => {
                db.collection('settings').doc('global').set({ activeSession: newSession }, { merge: true });
            };

            // DB 업데이트 헬퍼
            const setStudents = (val) => db.collection('classData').doc(currentSession).set({ students: val }, { merge: true });
            const setBills = (val) => db.collection('classData').doc(currentSession).set({ bills: val }, { merge: true });
            const setExecutiveData = (val) => db.collection('classData').doc(currentSession).set({ executiveData: val }, { merge: true });
            const setPraises = (val) => db.collection('classData').doc(currentSession).set({ praises: val }, { merge: true });
            const setPolls = (val) => db.collection('classData').doc(currentSession).set({ polls: val }, { merge: true });

            const maskName = (name) => {
                if (!isMasked) return name;
                if (!name) return '';
                if (name.length <= 2) return name.charAt(0) + '*';
                return name.charAt(0) + '*' + name.slice(2);
            };

            const openLoginModal = () => {
                setPwdInput('');
                setShowLoginModal(true);
            };

            const submitLogin = () => {
                if (pwdInput === passwords.teacher) setRole('teacher');
                else if (pwdInput === passwords.council) setRole('council');
                else setRole('student');
                setShowLoginModal(false);
            };

            const closeModal = () => {
                setModalType(null);
                setFormData({});
                setModalError('');
            };

            const handleFormChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
                if (modalError) setModalError('');
            };

            const submitActionModal = () => {
                switch(modalType) {
                    case 'editReport':
                        setExecutiveData({ ...executiveData, report: formData.report });
                        break;
                    case 'addComplaint':
                        if (!formData.text) return;
                        setExecutiveData({
                            ...executiveData,
                            complaints: [...(executiveData.complaints || []), { id: Date.now(), text: formData.text, status: '대기', reply: '' }]
                        });
                        break;
                    case 'manageComplaint':
                        setExecutiveData({
                            ...executiveData,
                            complaints: executiveData.complaints.map(c => c.id === formData.id ? { ...c, status: formData.status, reply: formData.reply } : c)
                        });
                        break;
                    case 'deleteComplaint':
                        setExecutiveData({
                            ...executiveData,
                            complaints: (executiveData.complaints || []).filter(c => c.id !== formData.id)
                        });
                        break;
                    case 'addBill':
                        if (!formData.title || !formData.content) return;
                        setBills([{
                            id: Date.now(), title: formData.title, proposer: formData.proposer || '익명',
                            sponsors: formData.sponsors || '없음', content: formData.content, status: '계류',
                            date: new Date().toISOString().split('T')[0]
                        }, ...bills]);
                        break;
                    case 'editBill':
                        if (!formData.title || !formData.content) return;
                        setBills(bills.map(b => b.id === formData.id ? { ...b, title: formData.title, proposer: formData.proposer, sponsors: formData.sponsors, content: formData.content } : b));
                        break;
                    case 'deleteBill':
                        setBills(bills.filter(b => b.id !== formData.id));
                        break;
                    case 'confirmBill':
                        setBills(bills.map(b => b.id === formData.id ? { ...b, status: formData.status } : b));
                        break;
                    case 'addStudent':
                        if (!formData.name) return;
                        const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                        setStudents([...students, { id: newId, name: formData.name, coins: Number(formData.coins) || 0, password: '' }]);
                        break;
                    case 'adjustCoin':
                        const amount = Number(formData.amount) || 0;
                        setStudents(students.map(s => s.id === formData.id ? { ...s, coins: formData.type === 'add' ? s.coins + amount : Math.max(0, s.coins - amount) } : s));
                        break;
                    case 'deleteStudent':
                        setStudents(students.filter(s => s.id !== formData.id));
                        break;
                    case 'changePassword':
                        const newPasswords = { ...passwords };
                        if (formData.newTeacherPwd) newPasswords.teacher = formData.newTeacherPwd;
                        if (formData.newCouncilPwd) newPasswords.council = formData.newCouncilPwd;
                        db.collection('settings').doc('global').set({ passwords: newPasswords }, { merge: true });
                        break;
                    case 'addPraise':
                        if (!formData.targetName || !formData.reason || !formData.detail || !formData.proposerName) return;
                        setPraises([{
                            id: Date.now(),
                            targetName: formData.targetName,
                            proposerName: formData.proposerName, 
                            reason: formData.reason,             
                            detail: formData.detail,             
                            date: new Date().toISOString().split('T')[0],
                            status: '대기'
                        }, ...praises]);
                        break;
                    case 'deletePraise':
                        setPraises(praises.filter(p => p.id !== formData.id));
                        break;
                    case 'rewardPraise':
                        const studentId = Number(formData.rewardStudentId);
                        const rewardAmount = Number(formData.rewardAmount);
                        if (studentId && rewardAmount > 0) {
                            setStudents(students.map(s => s.id === studentId ? { ...s, coins: s.coins + rewardAmount } : s));
                            setPraises(praises.map(p => p.id === formData.id ? { ...p, status: '보상완료' } : p));
                        }
                        break;
                    case 'addPoll':
                        if (!formData.title || !formData.options) return;
                        const validOptions = formData.options.filter(opt => opt.trim() !== '');
                        if(validOptions.length < 2) return;
                        setPolls([{
                            id: Date.now(), title: formData.title,
                            options: validOptions.map((opt, idx) => ({ id: idx, text: opt, voters: [] })),
                            passwords: {},
                            date: new Date().toISOString().split('T')[0], status: '진행중'
                        }, ...polls]);
                        break;
                    case 'viewPoll':
                        if (!formData.studentNum || formData.selectedOptionId === null || formData.selectedOptionId === undefined) return;
                        if (!formData.studentPassword) { setModalError('비밀번호를 입력하세요.'); return; }
                        
                        const voterNum = Number(formData.studentNum);
                        const currentPoll = polls.find(p => p.id === formData.pollId);
                        const pollPasswords = currentPoll.passwords || {};

                        if (pollPasswords[voterNum]) {
                            if (pollPasswords[voterNum] !== formData.studentPassword) {
                                setModalError('비밀번호가 일치하지 않습니다. 투표 내용을 수정할 수 없습니다.');
                                return;
                            }
                        } else {
                            pollPasswords[voterNum] = formData.studentPassword;
                        }

                        const updatedPolls = polls.map(poll => {
                            if (poll.id === formData.pollId) {
                                const newOptions = poll.options.map(opt => ({
                                    ...opt, voters: (opt.voters || []).filter(v => v !== voterNum)
                                }));
                                const targetOption = newOptions.find(opt => opt.id === Number(formData.selectedOptionId));
                                if(targetOption) targetOption.voters.push(voterNum);
                                return { ...poll, options: newOptions, passwords: pollPasswords };
                            }
                            return poll;
                        });
                        setPolls(updatedPolls);
                        break;
                    case 'deletePoll':
                        setPolls(polls.filter(p => p.id !== formData.pollId));
                        break;
                }
                closeModal();
            };

            return (
                <div className="min-h-screen flex flex-col bg-govLight">
                    <header className="bg-govBlue text-white shadow-lg sticky top-0 z-20">
                        <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-white/10 rounded-lg"><IconGov /></div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tight">학민정부</h1>
                                    <p className="text-xs text-govGold font-medium">제 5학년 학급 자치 대시보드</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                {role === 'teacher' ? (
                                    <select 
                                        value={currentSession} 
                                        onChange={(e) => handleSessionChange(e.target.value)}
                                        className="bg-white/10 text-white border border-white/30 rounded-lg px-3 py-1.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-white focus:bg-govBlue cursor-pointer hidden sm:block"
                                    >
                                        {sessionOptions.map(opt => (
                                            <option key={opt} value={opt} className="text-gray-900 bg-white">{opt}</option>
                                        ))}
                                    </select>
                                ) : (
                                    <span className="bg-white/10 px-3 py-1.5 rounded-lg text-sm font-bold hidden sm:block">
                                        현재 회기: {currentSession}
                                    </span>
                                )}

                                <span className={`px-3 py-1 rounded-full text-sm font-bold ${
                                    role === 'teacher' ? 'bg-red-500' : role === 'council' ? 'bg-blue-500' : 'bg-gray-500'
                                }`}>
                                    {role === 'teacher' ? '👩‍🏫 관리자' : role === 'council' ? '🧑‍💼 자치임원' : '👦 일반학생'}
                                </span>
                                {(role === 'teacher') && (
                                    <button onClick={() => { setModalType('changePassword'); setFormData({ newTeacherPwd: passwords.teacher, newCouncilPwd: passwords.council }); }} className="text-sm hover:text-govGold transition hidden sm:block">
                                        ⚙️ 비번설정
                                    </button>
                                )}
                                <button onClick={openLoginModal} className="text-sm hover:text-govGold transition font-bold">권한변경</button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-gray-200 sticky top-[72px] sm:top-[76px] z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 overflow-x-auto whitespace-nowrap scrollbar-hide">
                            {[
                                { id: 'executive', name: '행정부', icon: <IconUsers /> },
                                { id: 'legislative', name: '입법부', icon: <IconScroll /> },
                                { id: 'judicial', name: '사법부', icon: <IconGavel /> },
                                { id: 'praise', name: '익명 칭찬', icon: <IconHeart /> },
                                { id: 'poll', name: '여론조사', icon: <IconChart /> }
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center py-4 px-2 border-b-4 font-bold text-base sm:text-lg transition-colors ${
                                        activeTab === tab.id 
                                        ? 'border-govBlue text-govBlue' 
                                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    {tab.icon} {tab.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative">
                        {!isDataLoaded ? (
                            <div className="flex flex-col items-center justify-center py-20 space-y-4">
                                <div className="w-12 h-12 border-4 border-govBlue border-t-transparent rounded-full animate-spin"></div>
                                <p className="text-govBlue font-bold animate-pulse">데이터를 안전하게 동기화 중입니다...</p>
                            </div>
                        ) : (
                            <>
                                {/* 1. 행정부 */}
                                {activeTab === 'executive' && (
                                    <div className="space-y-6 animate-fade-in-up">
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-xl font-bold text-govBlue">📢 행정부 주간 활동 보고</h2>
                                                {(role === 'teacher' || role === 'council') && (
                                                    <button onClick={() => { setModalType('editReport'); setFormData({ report: executiveData.report }); }} className="text-sm bg-gray-100 px-3 py-1 rounded hover:bg-gray-200 font-bold">수정하기</button>
                                                )}
                                            </div>
                                            <p className="text-gray-700 leading-relaxed whitespace-pre-wrap">{executiveData.report}</p>
                                        </div>
                                        
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-xl font-bold text-govBlue">📬 실시간 학급 신문고</h2>
                                                <button onClick={() => { setModalType('addComplaint'); setFormData({ text: '' }); }} className="text-sm bg-govBlue text-white px-4 py-2 rounded-lg hover:bg-blue-900 font-bold shadow transition-colors">
                                                    + 의견 등록하기
                                                </button>
                                            </div>
                                            <div className="space-y-4">
                                                {(executiveData.complaints || []).length === 0 ? (
                                                    <p className="text-center py-8 text-gray-400 italic">등록된 민원이 없습니다.</p>
                                                ) : (
                                                    executiveData.complaints.map(comp => (
                                                        <div key={comp.id} className="p-4 border border-gray-100 bg-gray-50 rounded-lg relative">
                                                            <div className="flex justify-between items-start mb-2" 
                                                                 onClick={() => {
                                                                     if (role === 'teacher' || role === 'council') {
                                                                         setModalType('manageComplaint');
                                                                         setFormData(comp);
                                                                     }
                                                                 }}
                                                                 className={(role === 'teacher' || role === 'council') ? 'cursor-pointer' : ''}>
                                                                <p className="font-medium text-gray-800 pr-16">{comp.text}</p>
                                                                <span className={`absolute top-4 right-4 text-xs px-2 py-1 rounded-full font-bold ${
                                                                    comp.status === '대기' ? 'bg-yellow-100 text-yellow-800' : 
                                                                    comp.status === '해결' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-800'
                                                                }`}>{comp.status}</span>
                                                            </div>
                                                            {comp.reply && (
                                                                <div className="mt-3 pl-4 border-l-4 border-govBlue text-sm text-gray-600">
                                                                    <span className="font-bold text-govBlue mr-2">행정부 답변:</span>{comp.reply}
                                                                </div>
                                                            )}
                                                            {role === 'teacher' && (
                                                                <div className="mt-3 text-right">
                                                                    <button onClick={(e) => { e.stopPropagation(); setModalType('deleteComplaint'); setFormData({ id: comp.id }); }} className="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 px-2 py-1 rounded bg-white transition-colors">삭제하기</button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                                            </div>
                                                        </div>
                                                    ))

                                        </div>

                                                        <div className="mt-auto pt-4 border-t border-gray-100 text-xs text-gray-500">

                                                        {(role === 'teacher' || role === 'council') && bill.status === '계류' && (

                                                        )}
                                                    </div>
                                                ))}

                                        </div>
                                    </div>

                                                    <button onClick={() => { setModalType('addStudent'); setFormData({ name: '', coins: 0 }); }} className="bg-gray-800 text-white px-3 py-2 rounded shadow text-sm hover:bg-gray-900 font-bold">

                                                                </td>

                                                        </tr>

                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                                                </>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="col-span-full text-center py-10 text-gray-400 italic">아직 등록된 칭찬글이 없습니다.</div>

                                    </div>

                                                    </div>

                                    {modalType === 'deleteBill' && '🗑️ 법안 삭제'}
                                    
                                    {modalType === 'viewPoll' && '🗳️ 투표하기 (번호 전용 비번 필요)'}
                                    {modalType === 'viewPollStatus' && '📊 실시간 투표 현황'}
                                    {modalType === 'addPoll' && '📊 새 여론조사 만들기'}
                                    {modalType === 'addComplaint' && '📬 신문고 의견 등록'}
                                    {modalType === 'manageComplaint' && '📬 민원 처리 및 답변'}
                                    {modalType === 'deleteComplaint' && '민원 삭제 확인'}
                                    {modalType === 'addPraise' && '💖 친구 칭찬 글쓰기'}
                                    {modalType === 'viewPraiseDetail' && '🔍 칭찬글 상세 내용'}
                                    {modalType === 'rewardPraise' && '🎁 보상 지급'}
                                    {modalType === 'editReport' && '보고서 수정'}
                                    {modalType === 'addStudent' && '학생 명부 추가'}
                                    {modalType === 'adjustCoin' && '코인 지급/차감'}
                                    {modalType === 'deletePoll' && '삭제 확인'}
                                    {modalType === 'deletePraise' && '삭제 확인'}

                                    {(modalType === 'addBill' || modalType === 'editBill') && (
                                        <>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">법안 제목</label>
                                                <input type="text" name="title" value={formData.title || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="예: 쉬는 시간 연장 법안" />
                                            </div>
                                            <div className="flex space-x-3 mb-4">
                                                <div className="flex-1">
                                                    <label className="block text-sm font-bold text-gray-700 mb-1">발의자</label>
                                                    <input type="text" name="proposer" value={formData.proposer || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="발의자 이름" />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="block text-sm font-bold text-gray-700 mb-1">공동발의</label>
                                                    <input type="text" name="sponsors" value={formData.sponsors || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="공동발의자 이름" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">법안 내용</label>
                                                <textarea name="content" value={formData.content || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 h-32 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="법안의 상세 내용을 적어주세요..."></textarea>
                                            </div>
                                        </>
                                    )}

                                    {modalType === 'viewBill' && (
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center">
                                                <span className={`text-sm px-3 py-1 rounded-full font-bold ${
                                                    formData.status === '계류' ? 'bg-gray-100 text-gray-600' : 
                                                    formData.status === '가결' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                                                }`}>{formData.status}</span>
                                                <span className="text-sm text-gray-500">{formData.date}</span>
                                            </div>
                                            <h4 className="text-2xl font-black text-gray-900 mt-2">{formData.title}</h4>
                                            <div className="bg-gray-50 p-4 rounded-lg text-gray-800 leading-relaxed whitespace-pre-wrap min-h-[120px] text-base border border-gray-200">
                                                {formData.content}
                                            </div>
                                            <div className="text-sm text-gray-600 border-t pt-4">
                                                <p className="mb-1"><strong className="text-gray-800">발의자:</strong> {maskName(formData.proposer)}</p>
                                                <p><strong className="text-gray-800">공동발의:</strong> {formData.sponsors?.split(', ').map(s => maskName(s)).join(', ')}</p>
                                            </div>
                                            {(role === 'teacher' || role === 'council') && formData.status !== '가결' && (
                                                <div className="flex gap-2 mt-4 pt-4 border-t border-gray-200">
                                                    <button onClick={() => setModalType('editBill')} className="flex-1 bg-gray-100 text-gray-700 py-2 rounded hover:bg-gray-200 font-bold text-sm transition-colors">수정하기</button>
                                                    <button onClick={() => setModalType('deleteBill')} className="flex-1 bg-red-50 text-red-700 py-2 rounded hover:bg-red-100 font-bold text-sm transition-colors">삭제하기</button>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {modalType === 'confirmBill' && (
                                        <p className="text-gray-700 text-lg">

                                    {/* 기타 모달 폼들 */}
                                    {modalType === 'addComplaint' && (
                                        <textarea name="text" value={formData.text || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-32 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="학급에 건의할 사항을 상세히 적어주세요. 욕설이나 비방은 삭제될 수 있습니다."></textarea>
                                    )}

                                    {modalType === 'manageComplaint' && (
                                        <>
                                            <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4">
                                                <p className="text-xs text-gray-500 font-bold mb-1 uppercase">제보 내용</p>
                                                <p className="text-sm text-gray-800 leading-relaxed font-medium">{formData.text}</p>
                                            </div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">처리 상태</label>
                                                <select name="status" value={formData.status || '대기'} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-govBlue focus:outline-none">
                                                    <option value="대기">⏳ 대기 중</option>
                                                    <option value="해결">✅ 해결 완료</option>
                                                    <option value="보류">⏸️ 처리 보류</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">행정부 공식 답변</label>
                                                <textarea name="reply" value={formData.reply || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-32 focus:ring-2 focus:ring-govBlue focus:outline-none" placeholder="답변 내용을 입력하세요."></textarea>
                                            </div>
                                        </>
                                    )}

                                    {modalType === 'addPraise' && (
                                        <>
                                            <div className="bg-pink-50 p-4 rounded-lg border border-pink-100 mb-2">
                                                <p className="text-xs text-pink-700 font-bold leading-relaxed">
                                                    ⚠️ 경고: 상세 내용을 성의 있게 적지 않거나 허위 사실을 기재할 경우, 게시글이 불시에 삭제될 수 있습니다.
                                                </p>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-700 mb-1">칭찬하는 사람 (나)</label>
                                                    <input type="text" name="proposerName" value={formData.proposerName || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-pink-500 focus:outline-none" placeholder="내 이름" />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-700 mb-1">칭찬 받는 친구</label>
                                                    <input type="text" name="targetName" value={formData.targetName || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-pink-500 focus:outline-none" placeholder="친구 이름" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">칭찬 이유 (간략하게)</label>
                                                <input type="text" name="reason" value={formData.reason || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-pink-500 focus:outline-none" placeholder="예: 급식 당번을 도와줌" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">칭찬 상세 내용 (구체적으로)</label>
                                                <textarea name="detail" value={formData.detail || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-32 focus:ring-2 focus:ring-pink-500 focus:outline-none" placeholder="언제, 어디서, 어떤 도움을 주었는지 자세히 적어주세요."></textarea>
                                            </div>
                                        </>
                                    )}

                                    {modalType === 'viewPraiseDetail' && (
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                                                <p className="text-sm font-bold text-indigo-800">작성자: {formData.proposerName}</p>
                                                <p className="text-xs text-indigo-600">{formData.date}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-gray-500 mb-1 uppercase tracking-tight">받는 사람 / 이유</p>
                                                <p className="text-lg font-black text-govBlue">{formData.targetName} / {formData.reason}</p>
                                            </div>
                                            <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                                <p className="text-xs font-bold text-gray-400 mb-2 uppercase">상세 제보 내용</p>
                                                <p className="text-gray-800 leading-relaxed whitespace-pre-wrap">{formData.detail}</p>
                                            </div>
                                        </div>
                                    )}

                                    {modalType === 'viewPoll' && (
                                        <>
                                            <div className="mb-4">
                                                <h4 className="text-lg font-bold text-gray-900 mb-2">{formData.title}</h4>
                                                <div className={`bg-indigo-50 p-4 rounded-xl border ${modalError ? 'border-red-300 animate-shake' : 'border-indigo-100'}`}>
                                                    <label className="block text-sm font-bold text-indigo-800 mb-2">내 번호 선택 (1번 ~ 18번)</label>
                                                    <select name="studentNum" value={formData.studentNum || ''} onChange={handleFormChange} className="w-full border border-indigo-300 rounded p-2 mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                                                        <option value="">-- 내 번호를 선택하세요 --</option>
                                                        {Array.from({ length: 18 }, (_, i) => i + 1).map(num => {
                                                            const isVoted = Object.keys(formData.passwords || {}).includes(String(num));
                                                            return (
                                                                <option key={num} value={num}>
                                                                    {num}번 {isVoted ? '(이미 투표함)' : ''}
                                                                </option>
                                                            );
                                                        })}
                                                    </select>
                                                    <label className="block text-sm font-bold text-indigo-800 mb-2 flex items-center">
                                                        <IconLock /> 투표 비밀번호 입력
                                                    </label>
                                                    <input 
                                                        type="password" 
                                                        name="studentPassword" 
                                                        value={formData.studentPassword || ''} 
                                                        onChange={handleFormChange} 
                                                        className={`w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white ${modalError ? 'border-red-500' : 'border-indigo-300'}`}
                                                        placeholder="비밀번호를 입력하세요" 
                                                    />
                                                    {modalError && <p className="text-red-600 text-xs mt-2 font-bold">❌ {modalError}</p>}
                                                </div>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">항목 선택</label>
                                                {formData.options && formData.options.map(opt => (
                                                    <label key={opt.id} className={`flex items-center p-3 border rounded-lg cursor-pointer transition-colors ${formData.selectedOptionId === opt.id ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                                        <input type="radio" name="selectedOptionId" value={opt.id} checked={formData.selectedOptionId === opt.id} onChange={() => setFormData({ ...formData, selectedOptionId: opt.id })} className="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300" />
                                                        <span className="ml-3 font-medium text-gray-900">{opt.text}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </>
                                    )}

                                    {modalType === 'viewPollStatus' && (
                                        <div className="space-y-4">
                                            <div className="bg-gray-50 rounded-lg overflow-hidden border border-gray-200">
                                                <table className="min-w-full divide-y divide-gray-200 text-sm">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-4 py-2 text-left font-bold text-gray-600">번호</th>
                                                            <th className="px-4 py-2 text-left font-bold text-gray-600">선택 항목</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="bg-white divide-y divide-gray-100">
                                                        {formData.options?.flatMap(opt => 
                                                            (opt.voters || []).map(voterNum => ({ voterNum, text: opt.text }))
                                                        ).sort((a, b) => a.voterNum - b.voterNum).map(item => (
                                                            <tr key={item.voterNum} className="hover:bg-indigo-50/30">
                                                                <td className="px-4 py-2 font-bold text-indigo-600">{item.voterNum}번</td>
                                                                <td className="px-4 py-2 text-gray-700">{item.text}</td>
                                                            </tr>
                                                        ))}
                                                        {(!formData.options || formData.options.every(o => !o.voters || o.voters.length === 0)) && (
                                                            <tr>
                                                                <td colSpan="2" className="px-4 py-8 text-center text-gray-400 italic">데이터가 없습니다.</td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {modalType === 'addPoll' && (
                                        <>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">설문 주제</label>
                                                <input type="text" name="title" value={formData.title || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="설문 제목" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-2">선택지 항목</label>
                                                {formData.options?.map((opt, idx) => (
                                                    <input key={idx} type="text" value={opt} onChange={(e) => {
                                                        const newOpts = [...formData.options];
                                                        newOpts[idx] = e.target.value;
                                                        setFormData({ ...formData, options: newOpts });
                                                    }} className="w-full border border-gray-300 rounded p-2 mb-2" placeholder={`선택지 ${idx+1}`} />
                                                ))}
                                                <button onClick={() => setFormData({...formData, options: [...formData.options, '']})} className="text-xs font-bold text-indigo-600">+ 항목 추가</button>
                                            </div>
                                        </>
                                    )}

                                    {modalType.includes('delete') && <p className="text-gray-700">정말로 삭제하시겠습니까? 삭제 후에는 복구할 수 없습니다.</p>}
                                    {modalType === 'editReport' && (
                                        <textarea name="report" value={formData.report || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-40 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="보고서 내용"></textarea>
                                    )}
                                    {modalType === 'addStudent' && (
                                        <>
                                            <input type="text" name="name" value={formData.name || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 mb-2" placeholder="이름" />
                                            <input type="number" name="coins" value={formData.coins || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="초기 코인" />
                                        </>
                                    )}
                                    {modalType === 'rewardPraise' && (
                                        <>
                                            <div className="bg-indigo-50 p-3 rounded-lg border border-indigo-100 mb-3">
                                                <p className="text-sm font-bold text-indigo-800">지급 대상: {formData.targetName}</p>
                                            </div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">명부에서 선택</label>
                                                <select name="rewardStudentId" value={formData.rewardStudentId || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2">
                                                    <option value="">학생을 선택하세요</option>
                                                    {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.coins}C)</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">지급 코인</label>
                                                <input type="number" name="rewardAmount" value={formData.rewardAmount || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="지급 수량" />
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'adjustCoin' && (
                                        <input type="number" name="amount" value={formData.amount || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="수량 입력" />
                                    )}
                                    {modalType === 'changePassword' && (
                                        <>
                                            <input type="text" name="newTeacherPwd" value={formData.newTeacherPwd || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 mb-2" placeholder="교사 비밀번호" />
                                            <input type="text" name="newCouncilPwd" value={formData.newCouncilPwd || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="자치회 비밀번호" />
                                        </>
                                    )}
                                </div>

                                <div className="flex justify-end space-x-2">
                                    {modalType === 'viewBill' ? (
                                        <button onClick={closeModal} className="px-4 py-2 text-sm bg-govBlue text-white rounded hover:bg-blue-900 font-bold w-full mt-2">닫기</button>
                                    ) : (
                                        <>
                                            <button onClick={closeModal} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-medium">취소</button>
                                            {modalType !== 'viewPraiseDetail' && modalType !== 'viewPollStatus' && (
                                                <button onClick={submitActionModal} className={`px-4 py-2 text-sm text-white rounded font-bold ${
                                                    modalType.includes('delete') ? 'bg-red-600 hover:bg-red-700' : 'bg-govBlue hover:bg-blue-900'
                                                }`}>확인</button>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 로그인 모달 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
                                <h3 className="text-xl font-bold text-govBlue mb-2">권한 변경</h3>
                                <p className="text-sm text-gray-600 mb-4">비밀번호를 입력하세요.</p>
                                <input type="password" value={pwdInput} onChange={(e) => setPwdInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submitLogin()} className="w-full border border-gray-300 rounded p-2 mb-4 focus:outline-none focus:border-govBlue" placeholder="비밀번호 입력" autoFocus />
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setShowLoginModal(false)} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-medium">취소</button>
                                    <button onClick={submitLogin} className="px-4 py-2 text-sm bg-govBlue text-white rounded hover:bg-blue-900 font-bold">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
