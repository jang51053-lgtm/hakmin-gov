<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학민정부 실시간 대시보드 v5.6 (개정안 기능 추가)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }

    <script src="https://cdn.tailwindcss.com"></script>

                    }
                }

        }

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>

<body class="bg-govLight text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyCVJmFud6HYoKMHzB71oGTUEDJ0jwcrWy4",
            authDomain: "hakmin-gov.firebaseapp.com",
            projectId: "hakmin-gov",
            storageBucket: "hakmin-gov.firebasestorage.app",
            messagingSenderId: "424077081688",
            appId: "1:424077081688:web:d0230b7583771bd2a69e2d"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect } = React;

        const initialStudents = [];
        const initialBills = [];
        const initialExecutive = { report: '새로운 회기가 시작되었습니다.', complaints: [] };
        const initialPraises = [];
        const initialPolls = [];
        const initialFreePosts = [];

        // 초기 전역 법률 데이터 뼈대
        const initialLawsData = [
            {
                id: 'constitution',
                title: '학민정부 헌법',
                articles: [
                    { articleNum: 1, title: '총강', clauses: [{ clauseNum: 1, text: '대한학급은 민주공화국이다.' }, { clauseNum: 2, text: '학급의 주권은 학생에게 있고, 모든 권력은 학생으로부터 나온다.' }] },
                    { articleNum: 2, title: '국민의 권리와 의무', clauses: [{ clauseNum: 1, text: '모든 학생은 학급 내에서 평등하다.' }, { clauseNum: 2, text: '모든 학생은 정해진 학급의 규칙을 준수할 의무를 진다.' }] }
                ]
            },
            {
                id: 'law-life',
                title: '학급 생활법',
                articles: [
                    { articleNum: 1, title: '쉬는 시간 보장', clauses: [{ clauseNum: 1, text: '모든 학생은 쉬는 시간에 충분한 휴식을 취할 권리가 있다.' }, { clauseNum: 2, text: '쉬는 시간 중 타인의 휴식을 방해하는 행위를 금지한다.' }] },
                    { articleNum: 2, title: '수업 준비', clauses: [{ clauseNum: 1, text: '수업 시작 종이 울리면 자리에 앉아 수업 준비를 마쳐야 한다.' }] }
                ]
            }
        ];

        const PARTY_COLORS = [
            { key: 'gray', label: '기본(흰색)', bg: 'bg-white', border: 'border-gray-100', swatch: 'bg-white' },
            { key: 'red', label: '빨강', bg: 'bg-red-50', border: 'border-red-200', swatch: 'bg-red-400' },
            { key: 'orange', label: '주황', bg: 'bg-orange-50', border: 'border-orange-200', swatch: 'bg-orange-400' },
            { key: 'yellow', label: '노랑', bg: 'bg-yellow-50', border: 'border-yellow-200', swatch: 'bg-yellow-400' },
            { key: 'green', label: '초록', bg: 'bg-green-50', border: 'border-green-200', swatch: 'bg-green-400' },
            { key: 'blue', label: '파랑', bg: 'bg-blue-50', border: 'border-blue-200', swatch: 'bg-blue-400' },
            { key: 'indigo', label: '남색', bg: 'bg-indigo-50', border: 'border-indigo-200', swatch: 'bg-indigo-400' },
            { key: 'purple', label: '보라', bg: 'bg-purple-50', border: 'border-purple-200', swatch: 'bg-purple-400' },
            { key: 'pink', label: '분홍', bg: 'bg-pink-50', border: 'border-pink-200', swatch: 'bg-pink-400' }
        ];
        const getPartyColor = (key) => PARTY_COLORS.find(c => c.key === key) || PARTY_COLORS[0];
        const getOrderedMembers = (party, memberList) => [
            ...memberList.filter(m => m.id === party.leaderId),
            ...memberList.filter(m => m.id === party.coreMemberId && m.id !== party.leaderId),
            ...memberList.filter(m => m.id !== party.leaderId && m.id !== party.coreMemberId)
        ];

        const IconGov = () => <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>;
        const IconGavel = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>;
        const IconScroll = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
        const IconUsers = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconHeart = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>;
        const IconChart = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>;
        const IconLock = () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>;
        const IconEye = () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>;
        const IconMessage = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>;
        const IconEdit = () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>;
        const IconFlag = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3v18M3 4h13l-2 4 2 4H3"></path></svg>;

        const App = () => {
            const [activeTab, setActiveTab] = useState('executive');
            const [role, setRole] = useState('student');
            const [isMasked, setIsMasked] = useState(true);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [pwdInput, setPwdInput] = useState('');
            const [modalType, setModalType] = useState(null);
            const [formData, setFormData] = useState({});
            const [modalError, setModalError] = useState('');
            const [isDataLoaded, setIsDataLoaded] = useState(false);

            // 입법부 전용 State
            const [legisSubTab, setLegisSubTab] = useState('bills'); 
            const [selectedLawId, setSelectedLawId] = useState('');
            const [globalLaws, setGlobalLaws] = useState([]);

            const sessionOptions = [
                ...Array.from({ length: 10 }, (_, i) => `${i + 3}월`),
                ...Array.from({ length: 10 }, (_, i) => `임시회의 ${i + 1}`)
            ];
            
            const [currentSession, setCurrentSession] = useState('3월');
            const [passwords, setPasswords] = useState({ teacher: '1234', council: '5678' });
            const [appData, setAppData] = useState({});
            const [likedPosts, setLikedPosts] = useState(() => {
                try { return JSON.parse(localStorage.getItem('hakmin_liked_posts') || '[]'); } catch (e) { return []; }
            });

            // 정당 관리 전용 State (회기 무관 전역)
            const [globalStudents, setGlobalStudents] = useState(null);
            const [parties, setParties] = useState([]);
            const [loggedInStudentId, setLoggedInStudentId] = useState(() => {
                const saved = localStorage.getItem('hakmin_student_id');
                return saved ? Number(saved) : null;
            });
            
            useEffect(() => {
                const unsubscribeSettings = db.collection('settings').doc('global')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setCurrentSession(data.activeSession || '3월');
                            if (data.passwords) setPasswords(data.passwords);
                        }
                    });

                // 전역 법률 데이터 연동
                const unsubscribeLaws = db.collection('settings').doc('laws')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            setGlobalLaws(data.lawList || []);
                        } else {
                            db.collection('settings').doc('laws').set({ lawList: initialLawsData });
                            setGlobalLaws(initialLawsData);
                        }
                    });

                // 전역 학생 명부 연동 (회기 무관)
                const unsubscribeStudents = db.collection('settings').doc('students')
                    .onSnapshot((doc) => {
                        setGlobalStudents(doc.exists ? (doc.data().list || []) : null);
                    });

                // 전역 정당 데이터 연동 (회기 무관)
                const unsubscribeParties = db.collection('settings').doc('parties')
                    .onSnapshot((doc) => {
                        setParties(doc.exists ? (doc.data().list || []) : []);
                    });

                return () => {
                    unsubscribeSettings();
                    unsubscribeLaws();
                    unsubscribeStudents();
                    unsubscribeParties();
                };
            }, []);

            useEffect(() => {
                if (globalLaws.length > 0 && !globalLaws.find(l => l.id === selectedLawId)) {
                    setSelectedLawId(globalLaws[0].id);
                }
            }, [globalLaws, selectedLawId]);

            useEffect(() => {
                if (!currentSession) return;
                setIsDataLoaded(false);
                const unsubscribeData = db.collection('classData').doc(currentSession)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            setAppData(prev => ({ ...prev, [currentSession]: doc.data() }));
                        } else {
                            const initData = { bills: initialBills, executiveData: initialExecutive, praises: initialPraises, polls: initialPolls, freePosts: initialFreePosts };
                            setAppData(prev => ({ ...prev, [currentSession]: initData }));
                        }
                        setIsDataLoaded(true);
                    });
                return () => unsubscribeData();
            }, [currentSession]);

            const currentSessionData = appData[currentSession] || {
                bills: [], executiveData: { report: '', complaints: [] }, praises: [], polls: [], freePosts: []
            };

            const students = globalStudents || [];
            const bills = currentSessionData.bills || [];
            const executiveData = currentSessionData.executiveData || { report: '', complaints: [] };
            const praises = currentSessionData.praises || [];
            const polls = currentSessionData.polls || [];
            const freePosts = currentSessionData.freePosts || [];
            const loggedInStudent = students.find(s => s.id === loggedInStudentId) || null;
            const myParty = loggedInStudent ? parties.find(p => (p.memberIds || []).includes(loggedInStudent.id)) : null;

            // [삭제됨] 과거 "회기별 학생 명부 → 전역 명부" 1회 이관 코드가 여기 있었으나,
            // globalStudents의 초기값(null)과 "문서가 아직 로딩되지 않음"을 구분하지 못해
            // settings/students 리스너가 classData 리스너보다 늦게 응답하면(네트워크 지연 등)
            // 학생 명부 전체가 빈 배열로 덮어써지는 심각한 데이터 유실 버그가 있었습니다.
            // 이관은 이미 완료되었으므로(3752b1d) 더 이상 필요하지 않아 제거합니다.

            const handleSessionChange = (newSession) => db.collection('settings').doc('global').set({ activeSession: newSession }, { merge: true });

            const updateStudents = (updater) => {
                const docRef = db.collection('settings').doc('students');
                return db.runTransaction((transaction) => transaction.get(docRef).then((doc) => {
                    const latest = (doc.exists && doc.data().list) || [];
                    transaction.set(docRef, { list: updater(latest) }, { merge: true });
                }));
            };
            // classData 문서의 개별 필드(법안/행정부/칭찬/여론조사)를 트랜잭션으로 갱신.
            // 예전에는 로컬(클라이언트) state를 그대로 write했는데, 여러 학생이 거의 동시에
            // 법안을 등록/투표하면 나중 write가 서버의 최신 값을 덮어써 방금 등록된 데이터가
            // 통째로 사라지는 경쟁 상태(lost update)가 발생했습니다. 트랜잭션 안에서 서버의
            // 최신 값을 다시 읽은 뒤 그 값을 기준으로 갱신하도록 수정합니다.
            const updateClassField = (field, defaultVal, updater) => {
                const docRef = db.collection('classData').doc(currentSession);
                return db.runTransaction((transaction) => transaction.get(docRef).then((doc) => {
                    const latest = (doc.exists && doc.data()[field] !== undefined) ? doc.data()[field] : defaultVal;
                    transaction.set(docRef, { [field]: updater(latest) }, { merge: true });
                }));
            };
            const updateBills = (updater) => updateClassField('bills', initialBills, updater);
            const updateExecutiveData = (updater) => updateClassField('executiveData', initialExecutive, updater);
            const updatePraises = (updater) => updateClassField('praises', initialPraises, updater);
            const updatePolls = (updater) => updateClassField('polls', initialPolls, updater);
            const updateFreePosts = (updater) => {
                const docRef = db.collection('classData').doc(currentSession);
                return db.runTransaction((transaction) => transaction.get(docRef).then((doc) => {
                    const latestFreePosts = (doc.exists && doc.data().freePosts) || [];
                    transaction.set(docRef, { freePosts: updater(latestFreePosts) }, { merge: true });
                }));
            };
            const updateGlobalLaws = (newLawsList) => db.collection('settings').doc('laws').set({ lawList: newLawsList }, { merge: true });
            const updateParties = (updater) => {
                const docRef = db.collection('settings').doc('parties');
                return db.runTransaction((transaction) => transaction.get(docRef).then((doc) => {
                    const latest = (doc.exists && doc.data().list) || [];
                    transaction.set(docRef, { list: updater(latest) }, { merge: true });
                }));
            };

            const maskName = (name) => {
                if (!isMasked) return name;
                if (!name) return '';
                if (name.length <= 2) return name.charAt(0) + '*';
                return name.charAt(0) + '*' + name.slice(2);
            };

            const renderMemberBadge = (m, party) => {
                const isLeader = m.id === party.leaderId;
                const isCore = m.id === party.coreMemberId;
                const badgeStyle = isLeader ? 'bg-yellow-400 text-yellow-900 border-yellow-500' : isCore ? 'bg-purple-200 text-purple-800 border-purple-400' : 'bg-white text-gray-700 border-gray-300';
                return (
                    <span key={m.id} className={`text-xs font-bold px-2 py-1 rounded-full border ${badgeStyle}`}>
                        {isLeader ? '👑 ' : isCore ? '⭐ ' : ''}{maskName(m.name)}
                    </span>
                );
            };

            const getCircledNumber = (num) => {
                const circles = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩', '⑪', '⑫', '⑬', '⑭', '⑮'];
                return circles[num - 1] || `${num}.`;
            };

            const openLoginModal = () => { setPwdInput(''); setShowLoginModal(true); };
            const submitLogin = () => {
                if (pwdInput === passwords.teacher) setRole('teacher');
                else if (pwdInput === passwords.council) setRole('council');
                else setRole('student');
                setShowLoginModal(false);
            };
            const closeModal = () => { setModalType(null); setFormData({}); setModalError(''); };
            const handleFormChange = (e) => { setFormData({ ...formData, [e.target.name]: e.target.value }); if (modalError) setModalError(''); };

            const submitActionModal = () => {
                switch(modalType) {
                    case 'addLaw':
                    case 'editLaw':
                        if (!formData.title) return;
                        const updatedArticles = (formData.articles || []).map((art, idx) => {
                            const validClauses = (art.clauses || []).filter(c => c.text && c.text.trim() !== '').map((c, cIdx) => ({ clauseNum: cIdx + 1, text: c.text.trim() }));
                            return { articleNum: idx + 1, title: art.title, clauses: validClauses };
                        });
                        const newLaw = { id: formData.id || 'law_' + Date.now(), title: formData.title, articles: updatedArticles };
                        let newLawsList = modalType === 'addLaw' ? [...globalLaws, newLaw] : globalLaws.map(l => l.id === newLaw.id ? newLaw : l);
                        updateGlobalLaws(newLawsList);
                        if(modalType === 'addLaw') setSelectedLawId(newLaw.id);
                        break;
                    case 'deleteLaw':
                        const filteredLaws = globalLaws.filter(l => l.id !== formData.id);
                        updateGlobalLaws(filteredLaws);
                        if (selectedLawId === formData.id) setSelectedLawId(filteredLaws.length > 0 ? filteredLaws[0].id : '');
                        break;
                    case 'addBill':
                        if (!formData.title || !formData.content) return;
                        updateBills(latestBills => [{
                            id: Date.now(), title: formData.title, proposer: formData.proposer || '익명',
                            sponsors: formData.sponsors || '없음', content: formData.content, status: '계류', date: new Date().toISOString().split('T')[0]
                        }, ...latestBills]);
                        break;
                    case 'addAmendmentBill':
                        if (!formData.title || !formData.amendmentContent) return;
                        
                        // 개정 대상 법률 정보 정확하게 텍스트화
                        const tLaw = globalLaws.find(l => l.id === formData.targetLawId) || globalLaws[0];
                        const tArt = tLaw?.articles.find(a => String(a.articleNum) === String(formData.targetArticleNum)) || tLaw?.articles[0];
                        
                        const targetClauseId = formData.targetClauseNum || (typeof tArt?.clauses?.[0] === 'string' ? 1 : tArt?.clauses?.[0]?.clauseNum) || 1;
                        const tClause = tArt?.clauses?.find((c, idx) => {
                            const cNum = typeof c === 'string' ? idx + 1 : c.clauseNum;
                            return String(cNum) === String(targetClauseId);
                        }) || tArt?.clauses?.[0];
                        
                        const tClauseNum = typeof tClause === 'string' ? (tArt.clauses.indexOf(tClause) + 1) : tClause?.clauseNum;
                        const tClauseText = typeof tClause === 'string' ? tClause : tClause?.text;

                        const targetText = tLaw && tArt && tClause 
                            ? `[개정 대상: ${tLaw.title} 제${tArt.articleNum}조 ${tClauseNum}항]\n원문: ${tClauseText}\n\n` 
                            : '[개정 대상 미지정]\n\n';
                        
                        const finalContent = `${targetText}[개정 제안 내용]\n${formData.amendmentContent}`;

                        updateBills(latestBills => [{
                            id: Date.now(), title: formData.title, proposer: formData.proposer || '익명',
                            sponsors: formData.sponsors || '없음', content: finalContent, status: '계류',
                            date: new Date().toISOString().split('T')[0]
                        }, ...latestBills]);
                        break;
                    case 'editBill':
                        if (!formData.title || !formData.content) return;
                        updateBills(latestBills => latestBills.map(b => b.id === formData.id ? { ...b, title: formData.title, proposer: formData.proposer, sponsors: formData.sponsors, content: formData.content } : b));
                        break;
                    case 'deleteBill': updateBills(latestBills => latestBills.filter(b => b.id !== formData.id)); break;
                    case 'confirmBill': updateBills(latestBills => latestBills.map(b => b.id === formData.id ? { ...b, status: formData.status } : b)); break;
                    case 'editReport': updateExecutiveData(latest => ({ ...latest, report: formData.report })); break;
                    case 'addComplaint':
                        if (!formData.text) return;
                        updateExecutiveData(latest => ({ ...latest, complaints: [...(latest.complaints || []), { id: Date.now(), text: formData.text, status: '대기', reply: '' }] }));
                        break;
                    case 'manageComplaint':
                        updateExecutiveData(latest => ({ ...latest, complaints: (latest.complaints || []).map(c => c.id === formData.id ? { ...c, status: formData.status, reply: formData.reply } : c) }));
                        break;
                    case 'deleteComplaint':
                        updateExecutiveData(latest => ({ ...latest, complaints: (latest.complaints || []).filter(c => c.id !== formData.id) }));
                        break;
                    case 'addStudent':
                        if (!formData.name) return;
                        const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                        updateStudents(list => [...list, { id: newId, name: formData.name, coins: Number(formData.coins) || 0, password: formData.password || '', canCreateParty: !!formData.canCreateParty }]);
                        break;
                    case 'adjustCoin':
                        const amount = Number(formData.amount) || 0;
                        updateStudents(list => list.map(s => s.id === formData.id ? { ...s, coins: formData.type === 'add' ? s.coins + amount : Math.max(0, s.coins - amount) } : s));
                        break;
                    case 'deleteStudent': updateStudents(list => list.filter(s => s.id !== formData.id)); break;
                    case 'studentSettings':
                        updateStudents(list => list.map(s => s.id === formData.id ? { ...s, password: formData.password || '', canCreateParty: !!formData.canCreateParty } : s));
                        break;
                    case 'changePassword':
                        const newPasswords = { ...passwords };
                        if (formData.newTeacherPwd) newPasswords.teacher = formData.newTeacherPwd;
                        if (formData.newCouncilPwd) newPasswords.council = formData.newCouncilPwd;
                        db.collection('settings').doc('global').set({ passwords: newPasswords }, { merge: true });
                        break;
                    case 'addPraise':
                        if (!formData.targetName || !formData.reason || !formData.detail || !formData.proposerName) return;
                        updatePraises(latest => [{ id: Date.now(), targetName: formData.targetName, proposerName: formData.proposerName, reason: formData.reason, detail: formData.detail, date: new Date().toISOString().split('T')[0], status: '대기' }, ...latest]);
                        break;
                    case 'deletePraise': updatePraises(latest => latest.filter(p => p.id !== formData.id)); break;
                    case 'rewardPraise':
                        const studentId = Number(formData.rewardStudentId);
                        const rewardAmount = Number(formData.rewardAmount);
                        if (studentId && rewardAmount > 0) {
                            updateStudents(list => list.map(s => s.id === studentId ? { ...s, coins: s.coins + rewardAmount } : s));
                            updatePraises(latest => latest.map(p => p.id === formData.id ? { ...p, status: '보상완료' } : p));
                        }
                        break;
                    case 'studentLogin':
                        const targetStudent = students.find(s => s.id === Number(formData.studentId));
                        if (!targetStudent) { setModalError('학생을 선택하세요.'); return; }
                        if ((targetStudent.password || '') !== (formData.password || '')) { setModalError('비밀번호가 일치하지 않습니다.'); return; }
                        setLoggedInStudentId(targetStudent.id);
                        localStorage.setItem('hakmin_student_id', String(targetStudent.id));
                        break;
                    case 'addParty':
                        if (!formData.name || !loggedInStudent) return;
                        const newParty = { id: Date.now(), name: formData.name, color: formData.color || 'gray', leaderId: loggedInStudent.id, coreMemberId: null, memberIds: [loggedInStudent.id], pendingJoin: [], pendingLeave: [], password: '', subsidyBySession: {} };
                        updateParties(list => [...list, newParty]);
                        break;
                    case 'deleteParty': updateParties(list => list.filter(p => p.id !== formData.id)); break;
                    case 'setPartyPassword': {
                        if (!formData.newPwd || formData.newPwd.length < 2) { setModalError('비밀번호를 2자 이상 입력하세요.'); return; }
                        const setPwdPartyId = formData.partyId;
                        updateParties(list => list.map(p => p.id === setPwdPartyId ? { ...p, password: formData.newPwd } : p));
                        setModalType('partyManage');
                        setFormData({ partyId: setPwdPartyId });
                        setModalError('');
                        return;
                    }
                    case 'enterPartyPassword': {
                        const gateParty = parties.find(p => p.id === formData.partyId);
                        if (!gateParty || formData.pwdInput !== gateParty.password) { setModalError('비밀번호가 일치하지 않습니다.'); return; }
                        setModalType('partyManage');
                        setFormData({ partyId: formData.partyId });
                        setModalError('');
                        return;
                    }
                    case 'addPoll':
                        if (!formData.title || !formData.options) return;
                        const validOptions = formData.options.filter(opt => opt.trim() !== '');
                        if(validOptions.length < 2) return;
                        updatePolls(latest => [{ id: Date.now(), title: formData.title, options: validOptions.map((opt, idx) => ({ id: idx, text: opt, voters: [] })), passwords: {}, date: new Date().toISOString().split('T')[0], status: '진행중' }, ...latest]);
                        break;
                    case 'viewPoll': {
                        if (!formData.studentNum || formData.selectedOptionId === null || formData.selectedOptionId === undefined) return;
                        if (!formData.studentPassword) { setModalError('비밀번호를 입력하세요.'); return; }
                        const voterNum = Number(formData.studentNum);
                        const currentPoll = polls.find(p => p.id === formData.pollId);
                        const existingPwd = currentPoll && (currentPoll.passwords || {})[voterNum];
                        if (existingPwd && existingPwd !== formData.studentPassword) { setModalError('비밀번호가 일치하지 않습니다.'); return; }
                        // 투표는 서버의 최신 값(latest)을 기준으로 다시 계산한다: 여러 학생이 거의
                        // 동시에 투표하면 로컬 state(polls)가 서로의 표를 덮어쓸 수 있기 때문.
                        updatePolls(latest => latest.map(poll => {
                            if (poll.id !== formData.pollId) return poll;
                            const pollPasswords = { ...(poll.passwords || {}), [voterNum]: formData.studentPassword };
                            const newOptions = poll.options.map(opt => ({ ...opt, voters: (opt.voters || []).filter(v => v !== voterNum) }));
                            const targetOption = newOptions.find(opt => opt.id === Number(formData.selectedOptionId));
                            if (targetOption) targetOption.voters = [...targetOption.voters, voterNum];
                            return { ...poll, options: newOptions, passwords: pollPasswords };
                        }));
                        break;
                    }
                    case 'deletePoll': updatePolls(latest => latest.filter(p => p.id !== formData.pollId)); break;
                    case 'addFreePost':
                        if (!formData.title || !formData.content) return;
                        if (formData.content.length > 300) return;
                        if ((formData.authorName || '').length > 3) return;
                        const newFreePost = { id: Date.now(), title: formData.title, content: formData.content, authorName: formData.authorName || '익명', date: new Date().toISOString().split('T')[0], likes: 0, comments: [] };
                        updateFreePosts(posts => [newFreePost, ...posts]);
                        break;
                    case 'deleteFreePost': updateFreePosts(posts => posts.filter(p => p.id !== formData.id)); break;
                }
                closeModal();
            };

            const handleAddCommentSubmit = () => {
                const commentText = (formData.newCommentText || '').trim();
                const commentAuthor = (formData.newCommentAuthor || '').trim();
                if (!commentText || commentText.length > 300 || commentAuthor.length > 3) return;
                const newComment = { id: Date.now(), text: commentText, authorName: commentAuthor || '익명', date: new Date().toISOString().split('T')[0] };
                updateFreePosts(posts => posts.map(p => p.id === formData.id ? { ...p, comments: [...(p.comments || []), newComment] } : p));
                setFormData({ ...formData, comments: [...(formData.comments || []), newComment], newCommentText: '', newCommentAuthor: formData.newCommentAuthor });
            };

            const handleDeleteComment = (postId, commentId) => {
                updateFreePosts(posts => posts.map(p => p.id === postId ? { ...p, comments: (p.comments || []).filter(c => c.id !== commentId) } : p));
                if (formData.id === postId) setFormData({ ...formData, comments: (formData.comments || []).filter(c => c.id !== commentId) });
            };

            const handleLikePost = (postId) => {
                if (likedPosts.includes(postId)) return;
                updateFreePosts(posts => posts.map(p => p.id === postId ? { ...p, likes: (p.likes || 0) + 1 } : p));
                const newLiked = [...likedPosts, postId];
                setLikedPosts(newLiked);
                localStorage.setItem('hakmin_liked_posts', JSON.stringify(newLiked));
                if (formData && formData.id === postId) setFormData({ ...formData, likes: (formData.likes || 0) + 1 });
            };

            const requestJoinParty = (partyId) => {
                if (!loggedInStudent || myParty) return;
                updateParties(list => list.map(p => {
                    if (p.id !== partyId) return p;
                    if ((p.memberIds || []).includes(loggedInStudent.id) || (p.pendingJoin || []).includes(loggedInStudent.id)) return p;
                    return { ...p, pendingJoin: [...(p.pendingJoin || []), loggedInStudent.id] };
                }));
            };
            const requestLeaveParty = (partyId) => {
                if (!loggedInStudent) return;
                updateParties(list => list.map(p => {
                    if (p.id !== partyId || p.leaderId === loggedInStudent.id) return p;
                    if ((p.pendingLeave || []).includes(loggedInStudent.id)) return p;
                    return { ...p, pendingLeave: [...(p.pendingLeave || []), loggedInStudent.id] };
                }));
            };
            const approveJoin = (partyId, studentId) => {
                updateParties(list => list.map(p => p.id === partyId ? { ...p, memberIds: [...(p.memberIds || []), studentId], pendingJoin: (p.pendingJoin || []).filter(id => id !== studentId) } : p));
            };
            const rejectJoin = (partyId, studentId) => {
                updateParties(list => list.map(p => p.id === partyId ? { ...p, pendingJoin: (p.pendingJoin || []).filter(id => id !== studentId) } : p));
            };
            const approveLeave = (partyId, studentId) => {
                updateParties(list => list.map(p => p.id === partyId ? {
                    ...p,
                    memberIds: (p.memberIds || []).filter(id => id !== studentId),
                    pendingLeave: (p.pendingLeave || []).filter(id => id !== studentId),
                    coreMemberId: p.coreMemberId === studentId ? null : p.coreMemberId
                } : p));
            };
            const rejectLeave = (partyId, studentId) => {
                updateParties(list => list.map(p => p.id === partyId ? { ...p, pendingLeave: (p.pendingLeave || []).filter(id => id !== studentId) } : p));
            };
            const setCoreMember = (partyId, studentId) => {
                updateParties(list => list.map(p => p.id === partyId ? { ...p, coreMemberId: p.coreMemberId === studentId ? null : studentId } : p));
            };
            const transferLeader = (partyId, studentId) => {
                updateParties(list => list.map(p => p.id === partyId ? { ...p, leaderId: studentId, coreMemberId: p.coreMemberId === studentId ? null : p.coreMemberId } : p));
            };
            const saveSubsidyInputs = (partyId, billsPassed, billsProposed) => {
                updateParties(list => list.map(p => p.id === partyId ? {
                    ...p,
                    subsidyBySession: { ...(p.subsidyBySession || {}), [currentSession]: { billsPassed: Number(billsPassed) || 0, billsProposed: Number(billsProposed) || 0 } }
                } : p));
            };

            return (
                <div className="min-h-screen flex flex-col bg-govLight">
                    <header className="bg-govBlue text-white shadow-lg sticky top-0 z-20">
                        <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-white/10 rounded-lg"><IconGov /></div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tight">학민정부</h1>
                                    <p className="text-xs text-govGold font-medium">제 5학년 학급 자치 대시보드</p>
                                </div>
                                <a href="https://jang51053-lgtm.github.io/hakminstock/" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 bg-govGold/20 hover:bg-govGold/30 text-govGold text-xs font-bold px-3 py-1.5 rounded-lg border border-govGold/40 transition-colors whitespace-nowrap">
                                    📈 주식시장 바로가기
                                </a>
                                <a href="https://jang51053-lgtm.github.io/lifeofhakmin/" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-white/30 transition-colors whitespace-nowrap">
                                    🎁 마니또&자기관리
                                </a>
                            </div>
                            <div className="flex items-center space-x-4">
                                {role === 'teacher' ? (
                                    <select value={currentSession} onChange={(e) => handleSessionChange(e.target.value)} className="bg-white/10 text-white border border-white/30 rounded-lg px-3 py-1.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-white focus:bg-govBlue cursor-pointer hidden sm:block">
                                        {sessionOptions.map(opt => <option key={opt} value={opt} className="text-gray-900 bg-white">{opt}</option>)}
                                    </select>
                                ) : (
                                    <span className="bg-white/10 px-3 py-1.5 rounded-lg text-sm font-bold hidden sm:block">현재 회기: {currentSession}</span>
                                )}
                                <span className={`px-3 py-1 rounded-full text-sm font-bold ${ role === 'teacher' ? 'bg-red-500' : role === 'council' ? 'bg-blue-500' : 'bg-gray-500' }`}>
                                    {role === 'teacher' ? '👩‍🏫 관리자' : role === 'council' ? '🧑‍💼 자치임원' : '👦 일반학생'}
                                </span>
                                {(role === 'teacher') && (
                                    <button onClick={() => { setModalType('changePassword'); setFormData({ newTeacherPwd: passwords.teacher, newCouncilPwd: passwords.council }); }} className="text-sm hover:text-govGold transition hidden sm:block">⚙️ 비번설정</button>
                                )}
                                <button onClick={openLoginModal} className="text-sm hover:text-govGold transition font-bold">권한변경</button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-gray-200 sticky top-[72px] sm:top-[76px] z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 overflow-x-auto whitespace-nowrap scrollbar-hide">
                            {[
                                { id: 'executive', name: '행정부', icon: <IconUsers /> },
                                { id: 'party', name: '정당', icon: <IconFlag /> },
                                { id: 'legislative', name: '입법부', icon: <IconScroll /> },
                                { id: 'judicial', name: '사법부', icon: <IconGavel /> },
                                { id: 'praise', name: '익명 칭찬', icon: <IconHeart /> },
                                { id: 'poll', name: '여론조사', icon: <IconChart /> },
                                { id: 'freeboard', name: '자유게시판', icon: <IconMessage /> }
                            ].map((tab) => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center py-4 px-2 border-b-4 font-bold text-base sm:text-lg transition-colors ${activeTab === tab.id ? 'border-govBlue text-govBlue' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    {tab.icon} {tab.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative">
                        {!isDataLoaded ? (
                            <div className="flex flex-col items-center justify-center py-20 space-y-4">
                                <div className="w-12 h-12 border-4 border-govBlue border-t-transparent rounded-full animate-spin"></div>
                                <p className="text-govBlue font-bold animate-pulse">데이터를 안전하게 동기화 중입니다...</p>
                            </div>
                        ) : (
                            <>
                                {}
                                {activeTab === 'executive' && (
                                    <div className="space-y-6 animate-fade-in-up">
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-xl font-bold text-govBlue">📢 행정부 주간 활동 보고</h2>
                                                {(role === 'teacher' || role === 'council') && (
                                                    <button onClick={() => { setModalType('editReport'); setFormData({ report: executiveData.report }); }} className="text-sm bg-gray-100 px-3 py-1 rounded hover:bg-gray-200 font-bold">수정하기</button>
                                                )}
                                            </div>
                                            <p className="text-gray-700 leading-relaxed whitespace-pre-wrap">{executiveData.report}</p>
                                        </div>
                                        
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-xl font-bold text-govBlue">📬 실시간 학급 신문고</h2>
                                                <button onClick={() => { setModalType('addComplaint'); setFormData({ text: '' }); }} className="text-sm bg-govBlue text-white px-4 py-2 rounded-lg hover:bg-blue-900 font-bold shadow transition-colors">+ 의견 등록하기</button>
                                            </div>
                                            <div className="space-y-4">
                                                {(executiveData.complaints || []).length === 0 ? (
                                                    <p className="text-center py-8 text-gray-400 italic">등록된 민원이 없습니다.</p>
                                                ) : (
                                                    executiveData.complaints.map(comp => (
                                                        <div key={comp.id} className="p-4 border border-gray-100 bg-gray-50 rounded-lg relative">
                                                            <div className={`flex justify-between items-start mb-2 ${(role === 'teacher' || role === 'council') ? 'cursor-pointer' : ''}`} onClick={() => { if (role === 'teacher' || role === 'council') { setModalType('manageComplaint'); setFormData(comp); } }}>
                                                                <p className="font-medium text-gray-800 pr-16">{comp.text}</p>
                                                                <span className={`absolute top-4 right-4 text-xs px-2 py-1 rounded-full font-bold ${comp.status === '대기' ? 'bg-yellow-100 text-yellow-800' : comp.status === '해결' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-800'}`}>{comp.status}</span>
                                                            </div>
                                                            {comp.reply && <div className="mt-3 pl-4 border-l-4 border-govBlue text-sm text-gray-600"><span className="font-bold text-govBlue mr-2">행정부 답변:</span>{comp.reply}</div>}
                                                            {role === 'teacher' && (
                                                                <div className="mt-3 text-right">
                                                                    <button onClick={(e) => { e.stopPropagation(); setModalType('deleteComplaint'); setFormData({ id: comp.id }); }} className="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 px-2 py-1 rounded bg-white transition-colors">삭제하기</button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {}
                                {activeTab === 'legislative' && (
                                    <div className="space-y-8 animate-fade-in-up">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 gap-4">
                                            <div className="flex space-x-2 sm:space-x-4 overflow-x-auto w-full md:w-auto pb-2 sm:pb-0 scrollbar-hide">
                                                <button onClick={() => setLegisSubTab('bills')} className={`text-base sm:text-lg font-bold px-4 py-2 rounded-lg transition-colors whitespace-nowrap ${legisSubTab === 'bills' ? 'bg-govBlue text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>📜 입법 현황</button>
                                                <button onClick={() => setLegisSubTab('laws')} className={`text-base sm:text-lg font-bold px-4 py-2 rounded-lg transition-colors whitespace-nowrap ${legisSubTab === 'laws' ? 'bg-govBlue text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>📖 현행 법률집</button>
                                            </div>
                                            {legisSubTab === 'bills' && (role === 'teacher' || role === 'council') && (
                                                <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                                                    <button onClick={() => { setModalType('addBill'); setFormData({ title: '', proposer: '', sponsors: '', content: '' }); }} className="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 font-bold shadow w-full sm:w-auto text-sm transition-colors">
                                                        + 새 법안 상정
                                                    </button>
                                                    <button onClick={() => { 
                                                        const firstLaw = globalLaws[0];
                                                        const firstArt = firstLaw?.articles[0];
                                                        const firstClause = firstArt?.clauses[0];
                                                        setModalType('addAmendmentBill'); 
                                                        setFormData({ 
                                                            title: '', proposer: '', sponsors: '', amendmentContent: '',
                                                            targetLawId: firstLaw?.id || '', targetArticleNum: firstArt?.articleNum || '', targetClauseNum: firstClause?.clauseNum || ''
                                                        }); 
                                                    }} className="bg-govBlue text-white px-4 py-2 rounded-lg hover:bg-blue-900 font-bold shadow w-full sm:w-auto text-sm transition-colors">
                                                        + 기존 법률 개정안 상정
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                        
                                        {/* 기존 입법 현황 (bills) */}
                                        {legisSubTab === 'bills' && (
                                            <>
                                                {/* 공포된 법안 (가결) */}
                                                <div className="bg-green-50/50 p-6 rounded-xl border border-green-100">
                                                    <h3 className="text-xl font-bold text-green-800 mb-4 flex items-center">
                                                        <span className="text-2xl mr-2">✅</span> 공포된 법안 (가결)
                                                    </h3>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                        {bills.filter(b => b.status === '가결').length === 0 ? (
                                                            <p className="text-gray-500 italic col-span-full">아직 가결된 법안이 없습니다.</p>
                                                        ) : (

                                                            const s = students.find(st => st.id === sid);
                                                            return (
                                                                <div key={sid} className="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-100">
                                                                    <span className="text-sm font-bold">{s ? maskName(s.name) : sid}</span>
                                                                    <div className="flex gap-1">
                                                                        <button onClick={() => approveJoin(party.id, sid)} className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold">승인</button>
                                                                        <button onClick={() => rejectJoin(party.id, sid)} className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-bold">거부</button>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                                <div>
                                                    <h5 className="font-bold text-sm text-gray-700 mb-2">📤 탈퇴 신청 ({(party.pendingLeave || []).length})</h5>
                                                    <div className="space-y-2">
                                                        {(party.pendingLeave || []).length === 0 && <p className="text-xs text-gray-400">없음</p>}
                                                        {(party.pendingLeave || []).map(sid => {
                                                            const s = students.find(st => st.id === sid);
                                                            return (
                                                                <div key={sid} className="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-100">
                                                                    <span className="text-sm font-bold">{s ? maskName(s.name) : sid}</span>
                                                                    <div className="flex gap-1">
                                                                        <button onClick={() => approveLeave(party.id, sid)} className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold">승인</button>
                                                                        <button onClick={() => rejectLeave(party.id, sid)} className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-bold">거부</button>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                                <div>
                                                    <h5 className="font-bold text-sm text-gray-700 mb-2">👥 당원 관리 ({members.length}명)</h5>
                                                    <div className="space-y-2 max-h-40 overflow-y-auto">
                                                        {members.map(m => (
                                                            <div key={m.id} className="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-100">
                                                                <span className="text-sm font-bold">{maskName(m.name)} {party.leaderId === m.id && <span className="text-govGold">👑</span>}{party.coreMemberId === m.id && <span className="text-indigo-500">⭐</span>}</span>
                                                                <div className="flex gap-1">
                                                                    {party.leaderId !== m.id && (
                                                                        <button onClick={() => transferLeader(party.id, m.id)} className="text-[10px] bg-govGold/20 text-govBlue px-2 py-1 rounded font-bold">당대표 위임</button>
                                                                    )}
                                                                    <button onClick={() => setCoreMember(party.id, m.id)} className="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-bold">{party.coreMemberId === m.id ? '최고위원 해제' : '최고위원 지정'}</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                                                    <h5 className="font-bold text-sm text-indigo-800 mb-2">💰 {currentSession} 지원금 계산</h5>
                                                    <div className="grid grid-cols-2 gap-2 mb-2">
                                                        <div><label className="block text-xs font-bold text-gray-600 mb-1">가결시킨 법안 수</label><input type="number" min="0" name="billsPassed" value={billsPassed} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-1.5 text-sm" /></div>
                                                        <div><label className="block text-xs font-bold text-gray-600 mb-1">상정한 법안 수</label><input type="number" min="0" name="billsProposed" value={billsProposed} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-1.5 text-sm" /></div>
                                                    </div>
                                                    <button onClick={() => saveSubsidyInputs(party.id, billsPassed, billsProposed)} className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded font-bold">저장</button>
                                                    <p className="text-xs text-gray-500 mt-2">당원수({members.length}) + 최고위원({party.coreMemberId ? 1 : 0}) + 가결({Number(billsPassed) || 0}) + 상정÷2 반올림({Math.round((Number(billsProposed) || 0) / 2)})</p>
                                                    <p className="text-lg font-black text-indigo-700 mt-1">= {preview} 코인</p>
                                                </div>
                                                <div className="border-t pt-3">
                                                    <label className="block text-xs font-bold text-gray-600 mb-2">정당 색상 변경</label>
                                                    <div className="flex flex-wrap gap-2">
                                                        {PARTY_COLORS.map(c => (
                                                            <button key={c.key} onClick={() => updateParties(list => list.map(p => p.id === party.id ? { ...p, color: c.key } : p))} title={c.label} className={`w-7 h-7 rounded-full border-2 ${c.swatch} ${(party.color || 'gray') === c.key ? 'ring-2 ring-offset-1 ring-govBlue' : 'border-gray-300'}`}></button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="border-t pt-3">
                                                    <label className="block text-xs font-bold text-gray-600 mb-1">정당 관리 비밀번호 변경</label>
                                                    <div className="flex gap-2">
                                                        <input type="password" value={formData.newManagePwd || ''} onChange={(e) => setFormData({ ...formData, newManagePwd: e.target.value })} className="flex-1 border border-gray-300 rounded p-1.5 text-sm" placeholder="새 비밀번호" />
                                                        <button onClick={() => { if (formData.newManagePwd) { updateParties(list => list.map(p => p.id === party.id ? { ...p, password: formData.newManagePwd } : p)); setFormData({ ...formData, newManagePwd: '' }); } }} className="text-xs bg-gray-700 text-white px-3 py-1.5 rounded font-bold">변경</button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                    {modalType === 'rewardPraise' && (
                                        <>
                                            <div className="bg-indigo-50 p-3 rounded-lg border border-indigo-100 mb-3"><p className="text-sm font-bold text-indigo-800">지급 대상: {formData.targetName}</p></div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">명부에서 선택</label>
                                                <select name="rewardStudentId" value={formData.rewardStudentId || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2">
                                                    <option value="">학생을 선택하세요</option>
                                                    {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.coins}C)</option>)}
                                                </select>
                                            </div>
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">지급 코인</label><input type="number" name="rewardAmount" value={formData.rewardAmount || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="지급 수량" /></div>
                                        </>
                                    )}
                                    {modalType === 'adjustCoin' && <input type="number" name="amount" value={formData.amount || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="수량 입력" />}
                                    {modalType === 'changePassword' && (
                                        <>
                                            <input type="text" name="newTeacherPwd" value={formData.newTeacherPwd || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 mb-2" placeholder="교사 비밀번호" />
                                            <input type="text" name="newCouncilPwd" value={formData.newCouncilPwd || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2" placeholder="자치회 비밀번호" />
                                        </>
                                    )}
                                </div>

                                <div className="flex justify-end space-x-2">
                                    {modalType === 'viewBill' || modalType === 'viewFreePost' || modalType === 'viewParty' || modalType === 'partyManage' ? (
                                        <button onClick={closeModal} className="px-4 py-2 text-sm bg-govBlue text-white rounded hover:bg-blue-900 font-bold w-full mt-2">닫기</button>
                                    ) : (
                                        <>
                                            <button onClick={closeModal} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-medium">취소</button>
                                            {modalType !== 'viewPraiseDetail' && modalType !== 'viewPollStatus' && (
                                                <button onClick={submitActionModal} className={`px-4 py-2 text-sm text-white rounded font-bold ${modalType.includes('delete') ? 'bg-red-600 hover:bg-red-700' : 'bg-govBlue hover:bg-blue-900'}`}>확인</button>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
                                <h3 className="text-xl font-bold text-govBlue mb-2">권한 변경</h3>
                                <p className="text-sm text-gray-600 mb-4">비밀번호를 입력하세요.</p>
                                <input type="password" value={pwdInput} onChange={(e) => setPwdInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submitLogin()} className="w-full border border-gray-300 rounded p-2 mb-4 focus:outline-none focus:border-govBlue" placeholder="비밀번호 입력" autoFocus />
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setShowLoginModal(false)} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-medium">취소</button>
                                    <button onClick={submitLogin} className="px-4 py-2 text-sm bg-govBlue text-white rounded hover:bg-blue-900 font-bold">확인</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
