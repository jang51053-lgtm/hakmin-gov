<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학민정부 실시간 대시보드 v5.0 (칭찬게시판 추가)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        govBlue: '#002244',
                        govGold: '#D4AF37',
                        govLight: '#F4F7F9'
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-govLight text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- Firebase 초기화 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCVJmFud6HYoKMHzB71oGTUEDJ0jwcrWy4",
            authDomain: "hakmin-gov.firebaseapp.com",
            projectId: "hakmin-gov",
            storageBucket: "hakmin-gov.firebasestorage.app",
            messagingSenderId: "424077081688",
            appId: "1:424077081688:web:d0230b7583771bd2a69e2d"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        console.log("🔥 Firebase 실시간 연동 (v5.0 업데이트 완료)");

        const { useState, useEffect } = React;

        // --- 초기 데이터 뼈대 ---
        const initialStudents = [];
        const initialBills = [];
        const initialExecutive = { report: '새로운 회기가 시작되었습니다.', complaints: [] };
        const initialPraises = [];

        // --- 아이콘 모음 ---
        const IconGov = () => <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>;
        const IconGavel = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>;
        const IconScroll = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
        const IconUsers = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconHeart = () => <svg className="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>;

        const App = () => {
            const [activeTab, setActiveTab] = useState('executive');
            const [role, setRole] = useState('student');
            const [isMasked, setIsMasked] = useState(true);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [pwdInput, setPwdInput] = useState('');
            const [modalType, setModalType] = useState(null);
            const [formData, setFormData] = useState({});

            const sessionOptions = [
                ...Array.from({ length: 10 }, (_, i) => `${i + 3}월`),
                ...Array.from({ length: 10 }, (_, i) => `임시회의 ${i + 1}`)
            ];
            const [currentSession, setCurrentSession] = useState('3월');
            const [passwords, setPasswords] = useState({ teacher: '1234', council: '5678' });

            const [appData, setAppData] = useState({});

            // 🔥 파이어베이스 실시간 데이터 불러오기
            useEffect(() => {
                const unsubscribe = db.collection('classData').doc(currentSession)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            setAppData(prev => ({ ...prev, [currentSession]: doc.data() }));
                        } else {
                            const initData = { students: initialStudents, bills: initialBills, executiveData: initialExecutive, praises: initialPraises };
                            db.collection('classData').doc(currentSession).set(initData);
                        }
                    });
                return () => unsubscribe();
            }, [currentSession]);

            const currentSessionData = appData[currentSession] || {
                students: [], bills: [], executiveData: { report: '로딩 중...', complaints: [] }, praises: []
            };

            const students = currentSessionData.students || [];
            const bills = currentSessionData.bills || [];
            const executiveData = currentSessionData.executiveData || { report: '', complaints: [] };
            const praises = currentSessionData.praises || [];

            // 🔥 파이어베이스 데이터 덮어쓰기
            const setStudents = (val) => db.collection('classData').doc(currentSession).set({ students: val }, { merge: true });
            const setBills = (val) => db.collection('classData').doc(currentSession).set({ bills: val }, { merge: true });
            const setExecutiveData = (val) => db.collection('classData').doc(currentSession).set({ executiveData: val }, { merge: true });
            const setPraises = (val) => db.collection('classData').doc(currentSession).set({ praises: val }, { merge: true });

            const maskName = (name) => {
                if (!isMasked) return name;
                if (!name) return '';
                if (name.length <= 2) return name.charAt(0) + '*';
                return name.charAt(0) + '*' + name.slice(2);
            };

            const openLoginModal = () => {
                setPwdInput('');
                setShowLoginModal(true);
            };

            const submitLogin = () => {
                if (pwdInput === passwords.teacher) setRole('teacher');
                else if (pwdInput === passwords.council) setRole('council');
                else setRole('student');
                setShowLoginModal(false);
            };

            const closeModal = () => {
                setModalType(null);
                setFormData({});
            };

            const handleFormChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const submitActionModal = () => {
                switch(modalType) {
                    case 'editReport':
                        setExecutiveData({ ...executiveData, report: formData.report });
                        break;
                    case 'addComplaint':
                        if (!formData.text) return;
                        setExecutiveData({
                            ...executiveData,
                            complaints: [...(executiveData.complaints || []), { id: Date.now(), text: formData.text, status: '대기', reply: '' }]
                        });
                        break;
                    case 'manageComplaint':
                        setExecutiveData({
                            ...executiveData,
                            complaints: executiveData.complaints.map(c => c.id === formData.id ? { ...c, status: formData.status, reply: formData.reply } : c)
                        });
                        break;
                    case 'deleteComplaint':
                        setExecutiveData({
                            ...executiveData,
                            complaints: executiveData.complaints.filter(c => c.id !== formData.id)
                        });
                        break;
                    case 'addBill':
                        if (!formData.title || !formData.content) return;
                        setBills([{
                            id: Date.now(), title: formData.title, proposer: formData.proposer || '익명',
                            sponsors: formData.sponsors || '없음', content: formData.content, status: '계류',
                            date: new Date().toISOString().split('T')[0]
                        }, ...bills]);
                        break;
                    case 'editBill':
                        if (!formData.title || !formData.content) return;
                        setBills(bills.map(b => b.id === formData.id ? { ...b, title: formData.title, proposer: formData.proposer, sponsors: formData.sponsors, content: formData.content } : b));
                        break;
                    case 'deleteBill':
                        setBills(bills.filter(b => b.id !== formData.id));
                        break;
                    case 'confirmBill':
                        setBills(bills.map(b => b.id === formData.id ? { ...b, status: formData.status } : b));
                        break;
                    case 'addStudent':
                        if (!formData.name) return;
                        const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                        setStudents([...students, { id: newId, name: formData.name, coins: Number(formData.coins) || 0 }]);
                        break;
                    case 'adjustCoin':
                        const amount = Number(formData.amount) || 0;
                        setStudents(students.map(s => s.id === formData.id ? { ...s, coins: formData.type === 'add' ? s.coins + amount : Math.max(0, s.coins - amount) } : s));
                        break;
                    case 'deleteStudent':
                        setStudents(students.filter(s => s.id !== formData.id));
                        break;
                    case 'changePassword':
                        if (formData.newTeacherPwd) setPasswords(prev => ({ ...prev, teacher: formData.newTeacherPwd }));
                        if (formData.newCouncilPwd) setPasswords(prev => ({ ...prev, council: formData.newCouncilPwd }));
                        break;
                    case 'addPraise':
                        if (!formData.targetName || !formData.reason) return;
                        setPraises([{
                            id: Date.now(),
                            targetName: formData.targetName,
                            reason: formData.reason,
                            date: new Date().toISOString().split('T')[0],
                            status: '대기'
                        }, ...praises]);
                        break;
                    case 'deletePraise':
                        setPraises(praises.filter(p => p.id !== formData.id));
                        break;
                    case 'rewardPraise':
                        const studentId = Number(formData.rewardStudentId);
                        const rewardAmount = Number(formData.rewardAmount);
                        if (studentId && rewardAmount > 0) {
                            setStudents(students.map(s => s.id === studentId ? { ...s, coins: s.coins + rewardAmount } : s));
                            setPraises(praises.map(p => p.id === formData.id ? { ...p, status: '보상완료' } : p));
                        }
                        break;
                }
                closeModal();
            };

            return (
                <div className="min-h-screen flex flex-col bg-govLight">
                    <header className="bg-govBlue text-white shadow-lg sticky top-0 z-20">
                        <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-white/10 rounded-lg"><IconGov /></div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tight">학민정부</h1>
                                    <p className="text-xs text-govGold font-medium">제 5학년 학급 자치 대시보드</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                <select 
                                    value={currentSession} 
                                    onChange={(e) => setCurrentSession(e.target.value)}
                                    className="bg-white/10 text-white border border-white/30 rounded-lg px-3 py-1.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-white focus:bg-govBlue cursor-pointer hidden sm:block"
                                >
                                    {sessionOptions.map(opt => (
                                        <option key={opt} value={opt} className="text-gray-900 bg-white">{opt}</option>
                                    ))}
                                </select>
                                <span className={`px-3 py-1 rounded-full text-sm font-bold ${
                                    role === 'teacher' ? 'bg-red-500' : role === 'council' ? 'bg-blue-500' : 'bg-gray-500'
                                }`}>
                                    {role === 'teacher' ? '👩‍🏫 관리자' : role === 'council' ? '🧑‍💼 자치임원' : '👦 일반학생'}
                                </span>
                                {(role === 'teacher') && (
                                    <button onClick={() => { setModalType('changePassword'); setFormData({ newTeacherPwd: passwords.teacher, newCouncilPwd: passwords.council }); }} className="text-sm hover:text-govGold transition hidden sm:block">
                                        ⚙️ 비번설정
                                    </button>
                                )}
                                <button onClick={openLoginModal} className="text-sm hover:text-govGold transition font-bold">권한변경</button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-gray-200 sticky top-[72px] sm:top-[76px] z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 overflow-x-auto whitespace-nowrap scrollbar-hide">
                            {[
                                { id: 'executive', name: '행정부', icon: <IconUsers /> },
                                { id: 'legislative', name: '입법부', icon: <IconScroll /> },
                                { id: 'judicial', name: '사법부', icon: <IconGavel /> },
                                { id: 'praise', name: '익명 칭찬', icon: <IconHeart /> }
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center py-4 px-2 border-b-4 font-bold text-base sm:text-lg transition-colors ${
                                        activeTab === tab.id 
                                        ? 'border-govBlue text-govBlue' 
                                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    {tab.icon} {tab.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        
                        {/* 1. 행정부 */}
                        {activeTab === 'executive' && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-govBlue">📢 행정부 주간 활동 보고</h2>
                                        {(role === 'teacher' || role === 'council') && (
                                            <button onClick={() => { setModalType('editReport'); setFormData({ report: executiveData.report }); }} className="text-sm bg-gray-100 px-3 py-1 rounded hover:bg-gray-200 font-bold">수정하기</button>
                                        )}
                                    </div>
                                    <p className="text-gray-700 leading-relaxed whitespace-pre-wrap">{executiveData.report}</p>
                                </div>
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-govBlue">📬 실시간 학급 신문고</h2>
                                        <button onClick={() => { setModalType('addComplaint'); setFormData({ text: '' }); }} className="text-sm bg-govBlue text-white px-4 py-2 rounded-lg hover:bg-blue-900 font-bold shadow">
                                            + 의견 등록하기
                                        </button>
                                    </div>
                                    <div className="space-y-4">
                                        {executiveData.complaints?.map(comp => (
                                            <div key={comp.id} className="p-4 border border-gray-100 bg-gray-50 rounded-lg relative">
                                                <div className="flex justify-between items-start mb-2" 
                                                     onClick={() => {
                                                         if (role === 'teacher' || role === 'council') {
                                                             setModalType('manageComplaint');
                                                             setFormData(comp);
                                                         }
                                                     }}
                                                     className={(role === 'teacher' || role === 'council') ? 'cursor-pointer' : ''}>
                                                    <p className="font-medium text-gray-800 pr-16">{comp.text}</p>
                                                    <span className={`absolute top-4 right-4 text-xs px-2 py-1 rounded-full font-bold ${
                                                        comp.status === '대기' ? 'bg-yellow-100 text-yellow-800' : 
                                                        comp.status === '해결' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-800'
                                                    }`}>{comp.status}</span>
                                                </div>
                                                {comp.reply && (
                                                    <div className="mt-3 pl-4 border-l-4 border-govBlue text-sm text-gray-600">
                                                        <span className="font-bold text-govBlue mr-2">행정부 답변:</span>{comp.reply}
                                                    </div>
                                                )}
                                                {role === 'teacher' && (
                                                    <div className="mt-3 text-right">
                                                        <button onClick={(e) => { e.stopPropagation(); setModalType('deleteComplaint'); setFormData({ id: comp.id }); }} className="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 px-2 py-1 rounded bg-white">삭제하기</button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. 입법부 */}
                        {activeTab === 'legislative' && (
                            <div className="space-y-8 animate-fade-in-up">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-govBlue">📜 입법부 법안 시스템</h2>
                                    {(role === 'teacher' || role === 'council') && (
                                        <button onClick={() => { setModalType('addBill'); setFormData({ title: '', proposer: '', sponsors: '', content: '' }); }} className="bg-govBlue text-white px-4 py-2 rounded-lg hover:bg-blue-900 font-bold shadow">
                                            + 새 법안 상정
                                        </button>
                                    )}
                                </div>
                                <div className="bg-green-50/50 p-6 rounded-xl border border-green-100">
                                    <h3 className="text-xl font-bold text-green-800 mb-4 flex items-center">
                                        <span className="text-2xl mr-2">✅</span> 공포된 법안 (가결)
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {bills.filter(b => b.status === '가결').length === 0 ? (
                                            <p className="text-gray-500 italic col-span-full">아직 가결된 법안이 없습니다.</p>
                                        ) : (
                                            bills.filter(b => b.status === '가결').map(bill => (
                                                <div key={bill.id} className="bg-white p-6 rounded-xl shadow-sm border border-green-200 flex flex-col h-full overflow-hidden relative">
                                                    <div className="absolute top-0 right-0 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">가결</div>
                                                    <div className="flex justify-between items-start mb-3 mt-2 cursor-pointer" onClick={() => { setModalType('viewBill'); setFormData(bill); }}>
                                                        <span className="text-xs text-gray-400">{bill.date}</span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-gray-900 mb-2 cursor-pointer" onClick={() => { setModalType('viewBill'); setFormData(bill); }}>{bill.title}</h3>
                                                    <p className="text-sm text-gray-600 mb-4 flex-grow line-clamp-2 cursor-pointer" onClick={() => { setModalType('viewBill'); setFormData(bill); }}>{bill.content}</p>
                                                    <div className="mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
                                                        <p className="text-xs text-gray-500"><span className="font-semibold text-gray-700">발의자:</span> {maskName(bill.proposer)}</p>
                                                        {role === 'teacher' && (
                                                            <button onClick={() => { setModalType('deleteBill'); setFormData({ id: bill.id, title: bill.title }); }} className="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 px-2 py-1 rounded">삭제</button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-xl font-bold text-gray-700 mb-4 flex items-center">
                                        <span className="text-2xl mr-2">⏳</span> 심사 중 및 부결 법안
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {bills.filter(b => b.status !== '가결').map(bill => (
                                            <div key={bill.id} onClick={() => { setModalType('viewBill'); setFormData(bill); }} className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col h-full cursor-pointer hover:shadow-md transition-shadow relative">
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className={`text-xs px-2 py-1 rounded-full font-bold ${
                                                        bill.status === '계류' ? 'bg-gray-100 text-gray-600' : 'bg-red-100 text-red-800'
                                                    }`}>{bill.status}</span>
                                                    <span className="text-xs text-gray-400">{bill.date}</span>
                                                </div>
                                                <h3 className="text-lg font-bold text-gray-900 mb-2">{bill.title}</h3>
                                                <p className="text-sm text-gray-600 mb-4 flex-grow line-clamp-3">{bill.content}</p>
                                                <div className="mt-auto pt-4 border-t border-gray-100 text-xs text-gray-500">
                                                    <p><span className="font-semibold text-gray-700">발의자:</span> {maskName(bill.proposer)}</p>
                                                    <p><span className="font-semibold text-gray-700">공동발의:</span> {bill.sponsors.split(', ').map(s => maskName(s)).join(', ')}</p>
                                                </div>
                                                {(role === 'teacher' || role === 'council') && bill.status === '계류' && (
                                                    <div className="flex gap-2 mt-4 pt-2">
                                                        <button onClick={(e) => { e.stopPropagation(); setModalType('confirmBill'); setFormData({ id: bill.id, title: bill.title, status: '가결' }); }} className="flex-1 bg-green-50 text-green-700 py-1 rounded border border-green-200 hover:bg-green-100 text-sm font-bold">가결</button>
                                                        <button onClick={(e) => { e.stopPropagation(); setModalType('confirmBill'); setFormData({ id: bill.id, title: bill.title, status: '부결' }); }} className="flex-1 bg-red-50 text-red-700 py-1 rounded border border-red-200 hover:bg-red-100 text-sm font-bold">부결</button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. 사법부 */}
                        {activeTab === 'judicial' && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <div>
                                        <h2 className="text-2xl font-bold text-govBlue">⚖️ 사법부 학급 코인 관리</h2>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <label className="flex items-center cursor-pointer hidden sm:flex">
                                            <div className="relative">
                                                <input type="checkbox" className="sr-only" checked={isMasked} onChange={() => setIsMasked(!isMasked)} />
                                                <div className={`block w-10 h-6 rounded-full transition-colors ${isMasked ? 'bg-govBlue' : 'bg-gray-300'}`}></div>
                                                <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${isMasked ? 'transform translate-x-4' : ''}`}></div>
                                            </div>
                                            <div className="ml-3 text-sm font-medium text-gray-700">이름 마스킹</div>
                                        </label>
                                        <button onClick={() => setIsMasked(!isMasked)} className="sm:hidden bg-gray-200 px-2 py-1 rounded text-xs font-bold">
                                            {isMasked ? '👀 이름 보기' : '🕶 이름 가리기'}
                                        </button>
                                        {(role === 'teacher') && (
                                            <button onClick={() => { setModalType('addStudent'); setFormData({ name: '', coins: 0 }); }} className="bg-gray-800 text-white px-3 py-2 rounded shadow text-sm hover:bg-gray-900 font-bold">
                                                + 학생 추가
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                                    <table className="min-w-full divide-y divide-gray-200">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">번호</th>
                                                <th className="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">이름</th>
                                                <th className="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">코인 현황</th>
                                                {(role === 'teacher' || role === 'council') && (
                                                    <th className="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">관리</th>
                                                )}
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-gray-200">
                                            {students.map((student) => (
                                                <tr key={student.id} className="hover:bg-gray-50 transition-colors">
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{student.id}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{maskName(student.name)}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-govBlue text-right">{student.coins.toLocaleString()} C</td>
                                                    {(role === 'teacher' || role === 'council') && (
                                                        <td className="px-6 py-4 whitespace-nowrap text-center">
                                                            <div className="flex justify-center space-x-2">
                                                                <button onClick={() => { setModalType('adjustCoin'); setFormData({ id: student.id, name: student.name, amount: '', type: 'deduct' }); }} className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold hover:bg-red-200">- 차감</button>
                                                                <button onClick={() => { setModalType('adjustCoin'); setFormData({ id: student.id, name: student.name, amount: '', type: 'add' }); }} className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold hover:bg-blue-200">+ 지급</button>
                                                                <button onClick={() => { setModalType('deleteStudent'); setFormData({ id: student.id, name: student.name }); }} className="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold hover:bg-gray-200">삭제</button>
                                                            </div>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 4. 익명 칭찬 게시판 */}
                        {activeTab === 'praise' && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div className="bg-gradient-to-r from-pink-50 to-red-50 p-6 rounded-xl shadow-sm border border-pink-100">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-black text-pink-600">💖 익명 칭찬 게시판</h2>
                                        <button onClick={() => { setModalType('addPraise'); setFormData({ targetName: '', reason: '' }); }} className="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600 font-bold shadow-md transition-colors">
                                            + 칭찬 글쓰기
                                        </button>
                                    </div>
                                    <p className="text-pink-800 text-sm font-medium">우리 반 친구들의 아름다운 행동을 익명으로 제보해주세요. 선생님이 확인 후 코인 보상을 지급합니다!</p>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {praises.map(praise => (
                                        <div key={praise.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-lg text-gray-900">받는 사람: <span className="text-govBlue">{praise.targetName}</span></h3>
                                                <span className={`text-xs px-2 py-1 rounded-full font-bold ${
                                                    praise.status === '보상완료' ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-600'
                                                }`}>{praise.status}</span>
                                            </div>
                                            <p className="text-gray-700 text-sm mb-4 leading-relaxed bg-gray-50 p-3 rounded">{praise.reason}</p>
                                            <div className="flex justify-between items-center mt-2 border-t pt-3">
                                                <span className="text-xs text-gray-400">{praise.date} 작성됨</span>
                                                {role === 'teacher' && (
                                                    <div className="space-x-2">
                                                        <button onClick={() => { setModalType('deletePraise'); setFormData({ id: praise.id }); }} className="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-2 py-1 rounded font-bold border border-red-200">삭제</button>
                                                        {praise.status !== '보상완료' && (
                                                            <button onClick={() => { setModalType('rewardPraise'); setFormData({ id: praise.id, targetName: praise.targetName, rewardStudentId: '', rewardAmount: '' }); }} className="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded font-bold border border-indigo-200">보상지급</button>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {praises.length === 0 && (
                                        <div className="col-span-full text-center py-10 text-gray-400 italic">아직 등록된 칭찬이 없습니다. 첫 번째 칭찬의 주인공을 만들어주세요!</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-white border-t border-gray-200 mt-auto py-6">
                        <div className="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
                            &copy; 2023 학민정부(學民政府) 민주주의 교실 프로젝트. All rights reserved.
                        </div>
                    </footer>

                    {/* 로그인 모달 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
                                <h3 className="text-xl font-bold text-govBlue mb-2">권한 변경</h3>
                                <p className="text-sm text-gray-600 mb-4">
                                    접근 권한 비밀번호를 입력하세요.<br/>
                                    <span className="text-xs text-gray-400">(선생님/임원 전용 비밀번호, 일반학생은 빈칸)</span>
                                </p>
                                <input type="password" value={pwdInput} onChange={(e) => setPwdInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submitLogin()} className="w-full border border-gray-300 rounded p-2 mb-4 focus:outline-none focus:border-govBlue focus:ring-1 focus:ring-govBlue" placeholder="비밀번호 입력" autoFocus />
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setShowLoginModal(false)} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-medium">취소</button>
                                    <button onClick={submitLogin} className="px-4 py-2 text-sm bg-govBlue text-white rounded hover:bg-blue-900 font-bold">확인</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 통합 액션 모달 */}
                    {modalType && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-govBlue mb-4 border-b pb-2">
                                    {modalType === 'editReport' && '행정부 보고 수정'}
                                    {modalType === 'addComplaint' && '신문고 의견 등록'}
                                    {modalType === 'manageComplaint' && '신문고 답변 및 상태 관리'}
                                    {modalType === 'deleteComplaint' && '신문고 게시글 삭제'}
                                    {modalType === 'addBill' && '새 법안 상정'}
                                    {modalType === 'editBill' && '법안 내용 수정'}
                                    {modalType === 'deleteBill' && '법안 삭제'}
                                    {modalType === 'confirmBill' && `법안 처리`}
                                    {modalType === 'viewBill' && '법안 상세 보기'}
                                    {modalType === 'addStudent' && '학생 추가'}
                                    {modalType === 'adjustCoin' && `코인 관리`}
                                    {modalType === 'deleteStudent' && '학생 삭제'}
                                    {modalType === 'changePassword' && '비밀번호 설정'}
                                    {modalType === 'addPraise' && '💖 친구 칭찬하기'}
                                    {modalType === 'deletePraise' && '칭찬 게시글 삭제'}
                                    {modalType === 'rewardPraise' && '칭찬 보상 지급하기'}
                                </h3>

                                <div className="space-y-4 mb-6">
                                    {modalType === 'editReport' && (
                                        <textarea name="report" value={formData.report || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-32 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="주간 활동 보고를 입력하세요..."></textarea>
                                    )}
                                    {modalType === 'addComplaint' && (
                                        <textarea name="text" value={formData.text || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-24 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="학급에 건의할 사항을 상세히 적어주세요..."></textarea>
                                    )}
                                    {modalType === 'deleteComplaint' && (
                                        <p className="text-gray-700 text-lg">해당 신문고 글을 <span className="text-red-600 font-bold">삭제</span>하시겠습니까?</p>
                                    )}
                                    {(modalType === 'addBill' || modalType === 'editBill') && (
                                        <>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">법안 제목</label>
                                                <input type="text" name="title" value={formData.title || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="예: 쉬는 시간 연장 법안" />
                                            </div>
                                            <div className="flex space-x-3 mt-3">
                                                <div className="flex-1">
                                                    <label className="block text-sm font-bold text-gray-700 mb-1">발의자</label>
                                                    <input type="text" name="proposer" value={formData.proposer || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="발의자 이름" />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="block text-sm font-bold text-gray-700 mb-1">공동발의</label>
                                                    <input type="text" name="sponsors" value={formData.sponsors || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="공동발의자 이름" />
                                                </div>
                                            </div>
                                            <div className="mt-3">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">법안 내용</label>
                                                <textarea name="content" value={formData.content || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 h-24 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="법안의 상세 내용을 적어주세요..."></textarea>
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'deleteBill' && (
                                        <p className="text-gray-700 text-lg">
                                            정말 <strong>[{formData.title}]</strong> 법안을 <span className="text-red-600 font-bold">삭제</span>하시겠습니까?<br/>
                                            <span className="text-sm text-gray-500 mt-2 block">이 작업은 되돌릴 수 없습니다.</span>
                                        </p>
                                    )}
                                    {modalType === 'manageComplaint' && (
                                        <>
                                            <div className="bg-gray-50 p-3 rounded mb-4 border border-gray-200">
                                                <p className="text-sm text-gray-800 font-medium">{formData.text}</p>
                                            </div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">처리 상태</label>
                                                <select name="status" value={formData.status || '대기'} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue">
                                                    <option value="대기">대기</option>
                                                    <option value="해결">해결</option>
                                                    <option value="보류">보류</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">행정부 답변</label>
                                                <textarea name="reply" value={formData.reply || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-3 h-24 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="답변을 입력하세요..."></textarea>
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'confirmBill' && (
                                        <p className="text-gray-700 text-lg">
                                            <strong>[{formData.title}]</strong> 법안을 <span className={formData.status === '가결' ? 'text-green-600 font-bold' : 'text-red-600 font-bold'}>{formData.status}</span> 처리하시겠습니까?
                                        </p>
                                    )}
                                    {modalType === 'viewBill' && (
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center">
                                                <span className={`text-sm px-3 py-1 rounded-full font-bold ${
                                                    formData.status === '계류' ? 'bg-gray-100 text-gray-600' : 
                                                    formData.status === '가결' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                                                }`}>{formData.status}</span>
                                                <span className="text-sm text-gray-500">{formData.date}</span>
                                            </div>
                                            <h4 className="text-2xl font-black text-gray-900 mt-2">{formData.title}</h4>
                                            <div className="bg-gray-50 p-4 rounded-lg text-gray-800 leading-relaxed whitespace-pre-wrap min-h-[120px] text-base">
                                                {formData.content}
                                            </div>
                                            <div className="text-sm text-gray-600 border-t pt-4">
                                                <p className="mb-1"><strong className="text-gray-800">발의자:</strong> {maskName(formData.proposer)}</p>
                                                <p><strong className="text-gray-800">공동발의:</strong> {formData.sponsors.split(', ').map(s => maskName(s)).join(', ')}</p>
                                            </div>
                                            {(role === 'teacher' || role === 'council') && formData.status !== '가결' && (
                                                <div className="flex gap-2 mt-4 pt-4 border-t border-gray-200">
                                                    <button onClick={() => setModalType('editBill')} className="flex-1 bg-gray-100 text-gray-700 py-2 rounded hover:bg-gray-200 font-bold text-sm transition-colors">수정하기</button>
                                                    <button onClick={() => setModalType('deleteBill')} className="flex-1 bg-red-50 text-red-700 py-2 rounded hover:bg-red-100 font-bold text-sm transition-colors">삭제하기</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    {modalType === 'addStudent' && (
                                        <>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">학생 이름</label>
                                                <input type="text" name="name" value={formData.name || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="학생 이름" />
                                            </div>
                                            <div className="mt-3">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">초기 코인</label>
                                                <input type="number" name="coins" value={formData.coins || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="0" />
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'adjustCoin' && (
                                        <>
                                            <div className="bg-gray-50 p-3 rounded mb-3">
                                                <p className="text-sm text-gray-600">대상 학생: <strong className="text-gray-900 text-lg">{maskName(formData.name)}</strong></p>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">{formData.type === 'add' ? '지급할 금액' : '차감할 금액'}</label>
                                                <input type="number" name="amount" value={formData.amount || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="금액 숫자만 입력" />
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'deleteStudent' && (
                                        <p className="text-gray-700 text-lg">
                                            정말 <strong>{maskName(formData.name)}</strong> 학생을 명부에서 <span className="text-red-600 font-bold">삭제</span>하시겠습니까?<br/>
                                            <span className="text-sm text-gray-500 mt-2 block">이 작업은 되돌릴 수 없습니다.</span>
                                        </p>
                                    )}
                                    {modalType === 'changePassword' && (
                                        <>
                                            <div className="bg-yellow-50 p-3 rounded mb-4 border border-yellow-200">
                                                <p className="text-sm text-yellow-800 font-medium">관리자 및 자치임원의 접속 비밀번호를 변경할 수 있습니다.</p>
                                            </div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">👩‍🏫 관리자(교사) 비밀번호</label>
                                                <input type="text" name="newTeacherPwd" value={formData.newTeacherPwd || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="새 비밀번호 입력" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">🧑‍💼 자치임원 비밀번호</label>
                                                <input type="text" name="newCouncilPwd" value={formData.newCouncilPwd || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-govBlue" placeholder="새 비밀번호 입력" />
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'addPraise' && (
                                        <>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-pink-700 mb-1">누구를 칭찬할까요?</label>
                                                <input type="text" name="targetName" value={formData.targetName || ''} onChange={handleFormChange} className="w-full border border-pink-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50" placeholder="친구 이름" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-pink-700 mb-1">어떤 아름다운 행동을 했나요?</label>
                                                <textarea name="reason" value={formData.reason || ''} onChange={handleFormChange} className="w-full border border-pink-300 rounded p-3 h-24 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50" placeholder="선행 내용을 자세히 적어주세요!"></textarea>
                                            </div>
                                        </>
                                    )}
                                    {modalType === 'deletePraise' && (
                                        <p className="text-gray-700 text-lg">해당 칭찬 게시글을 <span className="text-red-600 font-bold">삭제</span>하시겠습니까?</p>
                                    )}
                                    {modalType === 'rewardPraise' && (
                                        <>
                                            <div className="bg-indigo-50 p-3 rounded mb-4 border border-indigo-200">
                                                <p className="text-sm text-indigo-800 font-medium">[{formData.targetName}] 학생에게 칭찬 보상(코인)을 지급합니다.</p>
                                            </div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">명부에서 학생 선택</label>
                                                <select name="rewardStudentId" value={formData.rewardStudentId || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                                    <option value="">-- 학생을 선택하세요 --</option>
                                                    {students.map(s => (
                                                        <option key={s.id} value={s.id}>{s.name} (현재: {s.coins}C)</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">지급할 코인</label>
                                                <input type="number" name="rewardAmount" value={formData.rewardAmount || ''} onChange={handleFormChange} className="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="예: 100" />
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="flex justify-end space-x-2">
                                    {modalType === 'viewBill' ? (
                                        <button onClick={closeModal} className="px-4 py-2 text-sm bg-govBlue text-white rounded hover:bg-blue-900 font-bold w-full mt-2">닫기</button>
                                    ) : (
                                        <>
                                            <button onClick={closeModal} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded font-medium">취소</button>
                                            <button onClick={submitActionModal} className={`px-4 py-2 text-sm text-white rounded font-bold ${
                                                (modalType === 'deleteStudent' || modalType === 'deleteBill' || modalType === 'deleteComplaint' || modalType === 'deletePraise') ? 'bg-red-600 hover:bg-red-700' : 
                                                modalType === 'addPraise' ? 'bg-pink-500 hover:bg-pink-600' : 
                                                modalType === 'rewardPraise' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-govBlue hover:bg-blue-900'
                                            }`}>확인</button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
